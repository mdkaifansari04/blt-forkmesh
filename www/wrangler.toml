name = "forkmesh-www"
main = "worker.js"
compatibility_date = "2026-08-03"

[build]
command = "python3 ../app/tools/build_dashboard_assets.py && python3 ../app/tools/build_site_assets.py www"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

[vars]
APP_ORIGIN = "https://app.forkmesh.com"
WORLD_ORIGIN = "https://world.forkmesh.com"

[[services]]
binding = "APP"
service = "forkmesh-relay"

[[routes]]
pattern = "forkmesh.com"
custom_domain = true

[[routes]]
pattern = "www.forkmesh.com"
custom_domain = true

[observability]
enabled = true
head_sampling_rate = 0.05

[observability.logs]
enabled = true
head_sampling_rate = 0.05
invocation_logs = false
