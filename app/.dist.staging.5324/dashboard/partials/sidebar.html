      <aside id="dashboardSidebar" data-dashboard-sidebar aria-label="Dashboard navigation" class="flex h-full flex-col overflow-y-auto border-r border-border bg-[rgb(var(--dashboard-sidebar-rgb))]">
        <div class="flex items-center justify-between border-b border-border px-4 py-4">
          <a data-dashboard-logo class="flex items-center gap-2 text-sm font-semibold text-foreground" href="/dashboard" aria-label="Refresh BLT Dashboard">
            <img class="brand-mark h-7 w-7 object-contain" src="/assets/blt-logo.png" alt="" aria-hidden="true" />
            <span data-sidebar-user-name class="text-muted-foreground">Dashboard</span>
          </a>
          <button data-mobile-drawer-close type="button" aria-label="Close dashboard menu" class="inline-flex items-center justify-center rounded-md p-1.5 text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors">
            <i data-lucide="x" class="h-4 w-4"></i>
          </button>
        </div>

        <!-- One nav, three labelled groups. The flat list gave every
             destination the same weight, so "Chat" read as a peer of "Tasks".
             Grouping keeps the scan short: your own account, the work you do
             here, then the people around it. Every entry is a section of this
             dashboard — public pages like /status are reachable from the site
             chrome and the footer, and reading as a peer of Tasks here is
             exactly what made them not belong. -->
        <nav data-sidebar-main-menu class="border-b border-border px-3 py-3">
          <p id="sidebarGroupOverview" class="px-3 pb-1 text-[10px] font-semibold uppercase tracking-wide text-muted-foreground">Overview</p>
          <div role="group" aria-labelledby="sidebarGroupOverview" class="grid gap-1">
            <a data-nav="home" data-nav-link href="/dashboard" class="flex items-center gap-3 rounded-md px-3 py-2 text-left text-sm text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors">
              <i data-lucide="home" class="h-4 w-4 text-muted-foreground"></i>
              Dashboard
            </a>
            <a data-nav="profile" data-nav-link href="/dashboard/profile" class="flex items-center gap-3 rounded-md px-3 py-2 text-left text-sm text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors">
              <i data-lucide="user-round" class="h-4 w-4 text-muted-foreground"></i>
              Profile
            </a>
            <!-- Settings has no `nav` in dashboard_shell.PAGES, so the build
                 never marks this link current; it is here because Settings is
                 an account destination people go looking for, not a page you
                 arrive at from somewhere else. -->
            <a data-nav="settings" data-nav-link href="/dashboard/settings" class="flex items-center gap-3 rounded-md px-3 py-2 text-left text-sm text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors">
              <i data-lucide="settings" class="h-4 w-4 text-muted-foreground"></i>
              Settings
            </a>
          </div>

          <p id="sidebarGroupWorkspace" class="mt-4 px-3 pb-1 text-[10px] font-semibold uppercase tracking-wide text-muted-foreground">Workspace</p>
          <div role="group" aria-labelledby="sidebarGroupWorkspace" class="grid gap-1">
            <a data-nav="repos" data-nav-link href="/dashboard/repos" class="flex items-center gap-3 rounded-md px-3 py-2 text-left text-sm text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors">
              <i data-lucide="book-marked" class="h-4 w-4 text-muted-foreground"></i>
              Repositories
            </a>
            <a data-nav="orgs" data-nav-link href="/dashboard/orgs" class="flex items-center gap-3 rounded-md px-3 py-2 text-left text-sm text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors">
              <i data-lucide="building-2" class="h-4 w-4 text-muted-foreground"></i>
              Organizations
            </a>
            <a data-nav="tasks" data-nav-link href="/dashboard/tasks" class="flex items-center gap-3 rounded-md px-3 py-2 text-left text-sm text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors">
              <i data-lucide="list-checks" class="h-4 w-4 text-muted-foreground"></i>
              Tasks
            </a>
            <a data-nav="calendar" data-nav-link href="/dashboard/calendar" class="flex items-center gap-3 rounded-md px-3 py-2 text-left text-sm text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors">
              <i data-lucide="calendar-days" class="h-4 w-4 text-muted-foreground"></i>
              Calendar
            </a>
            <a data-nav="notes" data-nav-link href="/dashboard/notes" class="flex items-center gap-3 rounded-md px-3 py-2 text-left text-sm text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors">
              <i data-lucide="notebook-pen" class="h-4 w-4 text-muted-foreground"></i>
              Notes
            </a>
          </div>

          <p id="sidebarGroupCommunity" class="mt-4 px-3 pb-1 text-[10px] font-semibold uppercase tracking-wide text-muted-foreground">Community</p>
          <div role="group" aria-labelledby="sidebarGroupCommunity" class="grid gap-1">
            <a data-nav="chat" data-nav-link href="/dashboard/chat" class="flex items-center gap-3 rounded-md px-3 py-2 text-left text-sm text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors">
              <i data-lucide="messages-square" class="h-4 w-4 text-muted-foreground"></i>
              Chat
            </a>
            <a data-nav="network" data-nav-link href="/dashboard/network" class="flex items-center gap-3 rounded-md px-3 py-2 text-left text-sm text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors">
              <i data-lucide="activity" class="h-4 w-4 text-muted-foreground"></i>
              Network
            </a>
          </div>

          <div role="group" class="mt-4 grid gap-1">
            <!-- Same marker as the header's shield button, so one piece of
                 session code reveals both: hidden until the session is
                 actually an administrator AND the Worker has handed back the
                 secret console path. Never a link to "#". Unlabelled on
                 purpose: it is the only entry here, so a group heading would
                 sit above nothing for everyone who is not an administrator. -->
            <a
              data-admin-button
              href="#"
              class="hidden items-center gap-3 rounded-md px-3 py-2 text-left text-sm text-amber-500 hover:bg-amber-500/10 transition-colors"
            >
              <i data-lucide="shield-alert" class="h-4 w-4 text-amber-500"></i>
              Admin panel
            </a>
          </div>
        </nav>

        <div data-sidebar-top-repositories class="min-h-0 flex-1 px-3 py-3">
          <div class="mb-2 flex items-center justify-between gap-2 px-1">
            <span class="text-xs font-semibold text-muted-foreground">Top repositories</span>
            <span data-sidebar-repo-count class="rounded-full border border-border bg-secondary px-2 py-0.5 font-mono text-[10px] text-muted-foreground">0</span>
          </div>
          <div data-sidebar-repo-list class="grid gap-1"></div>
        </div>
      </aside>
