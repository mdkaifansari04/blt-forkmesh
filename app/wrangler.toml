name = "forkmesh-relay"
main = "src_build/entry.py"
compatibility_flags = [ "python_workers" ]
compatibility_date = "2026-08-03"
workers_dev = true
preview_urls = true

# [limits] cpu_ms requires a paid Workers plan. Free accounts reject deploy with
# code 100328 if this block is present.

[build]
command = "python3 tools/build_blt_home_css.py && python3 tools/build_dashboard_assets.py && python3 tools/build_worker_footprint.py && python3 tools/build_worker_python.py && python3 tools/build_site_assets.py app"


[assets]
directory = "./dist"
binding = "ASSETS"
# Dashboard clean URLs are no-trailing-slash (/dashboard/profile). The previous
# auto-trailing-slash setting 307'd those to /dashboard/profile/, then the
# Worker 308'd back — an infinite loop that made Profile unreachable.
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
run_worker_first = [
  "/",
  "/api",
  "/api/*",
  "/developers",
  "/health",
  "/favicon.ico",
  "/forgot-password",
  "/login",
  # Public organization pages (bare org URL). Each org that gets a landing
  # page needs its own literal entry here - a /* wildcard would drag every
  # static asset through the Worker.
  "/owasp-blt",
  "/reset-password",
  "/signup",
  "/status",
  "/simulate-sentry-error",
  "/rss.xml",
  "/feed.xml",
  "/.well-known/*",
  "/ap/*",
  "/nodeinfo/*",
  "/mcp",
  "/mcp/*",
  "/admin-*",
  "/@*",
  "/%40*",
  "/blog",
  "/blog/*",
  "/docs",
  "/docs/*",
  "/privacy",
  "/terms",
  "/*.html",
  "/dashboard",
  "/dashboard/*",
  # Keep fragment/static dashboard machinery on the ASSETS binding. Page HTML
  # stays Worker-owned via /dashboard/* so a wedged direct-asset response
  # cannot blank notes/tasks/repos while /dashboard still works.
  "!/dashboard/partials/*",
  "!/dashboard/js/*",
  "!/dashboard/tailwind.css",
  "/notes",
  "/notes/*",
  "/*/*",
  "!/assets/*",
  "!/favicon/*",
  # Landing document must stay on the ASSETS binding. Worker-first `/*.html`
  # would hairpin ASSETS.fetch(/blt-home.html) back into the Worker as 404 →
  # the `/` handler would then return 503 "unavailable".
  "!/blt-home.html",
  "!/blt-home.css",
]

# BLT relay is served only on workers.dev until a custom hostname is ready.
# Do not attach unresolved custom domains here — APP/WWW_ORIGIN redirects would
# bounce browsers off this host to a DNS black hole.

[vars]
NODE_NAME = "forkmesh-mainnode"
PUBLIC_BASE_URL = "https://forkmesh-relay.owaspblt.workers.dev"
API_ORIGIN = "https://forkmesh-relay.owaspblt.workers.dev"
APP_ORIGIN = "https://forkmesh-relay.owaspblt.workers.dev"
WWW_ORIGIN = "https://forkmesh-relay.owaspblt.workers.dev"
WORLD_ORIGIN = "https://forkmesh-relay.owaspblt.workers.dev"
CORS_ALLOWED_ORIGINS = "https://forkmesh-relay.owaspblt.workers.dev"
DISCORD_OAUTH_REDIRECT_URI = "https://forkmesh-relay.owaspblt.workers.dev/api/integrations/discord/callback"
NODE_SOLANA_ADDRESS = ""
COMMUNITY_REWARD_NETWORK = "mainnet-beta"
COMMUNITY_REWARD_RPC_URL = "https://api.mainnet-beta.solana.com"
REWARD_INTERVAL_MS = "3600000"
REWARD_JITTER_MAX_MS = "2700000"
REWARD_AMOUNT_LAMPORTS = "100000"
REWARD_MIN_UPTIME_MS = "1800000"
REWARD_MIN_CONTRIBUTION_UNITS = "0"
REWARD_HEALTH_FRESH_MS = "600000"
FORKBOT_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
WORKER_ROLE = "app"
SINGLE_WORKER_SITE = "true"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "REPOSITORY_METADATA"
id = "d2f81b0d92674c6591d68477ef13ab3a"

[[durable_objects.bindings]]
name = "FORKMESH_MAINNODE_ROOM"
class_name = "ForkMeshRoom"

[[durable_objects.bindings]]
name = "FORKMESH_WORLD"
class_name = "ForkMeshWorld"

[[durable_objects.bindings]]
name = "FORKMESH_OFFICE_ROOM"
class_name = "ForkMeshOfficeRoom"

[[durable_objects.bindings]]
name = "FORKMESH_NODES"
class_name = "ForkMeshNodes"

[[durable_objects.bindings]]
name = "FORKMESH_NOTE_ROOM"
class_name = "ForkMeshNoteRoom"

[[durable_objects.bindings]]
name = "FORKMESH_CRON_WATCHDOG"
class_name = "ForkMeshCronWatchdog"

[[durable_objects.bindings]]
name = "FORKMESH_CRON_RUNNER"
class_name = "ForkMeshCronRunner"

[[durable_objects.bindings]]
name = "FORKMESH_DISCORD_GATE"
class_name = "ForkMeshDiscordGate"

[[d1_databases]]
binding = "DB"
database_name = "forkmesh"
database_id = "bf90dd5d-338a-421f-9867-5252d2193c2d"
migrations_dir = "migrations"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "forkmesh-dev"
database_id = "REPLACE_WITH_DEV_D1_DATABASE_ID"
migrations_dir = "migrations"

[env.dev.vars]
COMMUNITY_REWARD_NETWORK = "devnet"
COMMUNITY_REWARD_RPC_URL = "https://api.devnet.solana.com"

[[env.dev.durable_objects.bindings]]
name = "FORKMESH_MAINNODE_ROOM"
class_name = "ForkMeshRoom"

[[env.dev.durable_objects.bindings]]
name = "FORKMESH_WORLD"
class_name = "ForkMeshWorld"

[[env.dev.durable_objects.bindings]]
name = "FORKMESH_OFFICE_ROOM"
class_name = "ForkMeshOfficeRoom"

[[env.dev.durable_objects.bindings]]
name = "FORKMESH_NODES"
class_name = "ForkMeshNodes"

[[env.dev.durable_objects.bindings]]
name = "FORKMESH_NOTE_ROOM"
class_name = "ForkMeshNoteRoom"

[[env.dev.durable_objects.bindings]]
name = "FORKMESH_CRON_WATCHDOG"
class_name = "ForkMeshCronWatchdog"

[[env.dev.durable_objects.bindings]]
name = "FORKMESH_CRON_RUNNER"
class_name = "ForkMeshCronRunner"

[[env.dev.durable_objects.bindings]]
name = "FORKMESH_DISCORD_GATE"
class_name = "ForkMeshDiscordGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ForkMeshRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ForkMeshCatalog"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ForkMeshFiles"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ForkMeshHost"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["ForkMeshAccounts"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["ForkMeshIssues"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["ForkMeshPulls"]

[[migrations]]
tag = "v8"
deleted_classes = [
    "ForkMeshCatalog",
    "ForkMeshFiles",
    "ForkMeshAccounts",
    "ForkMeshIssues",
    "ForkMeshPulls",
]

[[migrations]]
tag = "v9"
new_sqlite_classes = ["ForkMeshWorld"]

[[migrations]]
tag = "v10"
deleted_classes = ["ForkMeshHost"]

[[migrations]]
tag = "v11"
new_sqlite_classes = ["ForkMeshOfficeRoom"]

[[migrations]]
tag = "v12"
new_sqlite_classes = ["ForkMeshNodes"]

[[migrations]]
tag = "v13"
new_sqlite_classes = ["ForkMeshCronWatchdog"]

[[migrations]]
tag = "v14"
new_sqlite_classes = ["ForkMeshCronRunner"]

[[migrations]]
tag = "v15"
new_sqlite_classes = ["ForkMeshDiscordGate"]

[[migrations]]
tag = "v16"
new_sqlite_classes = ["ForkMeshNoteRoom"]


[observability]
enabled = true
head_sampling_rate = 0.05

[observability.logs]
enabled = true
head_sampling_rate = 0.05
invocation_logs = false

[observability.traces]
enabled = false
