<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="/api-client.js?v=583e3a3d9d7b"></script>
    <script src="/posthog.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password · BLT</title>
    <meta name="description" content="Request a password reset link for your BLT account." />
    <meta name="application-name" content="BLT" />
    <meta name="apple-mobile-web-app-title" content="BLT" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <script src="/forgot-password.js?v=08887e4fc1d1" defer></script>
    <style>
      body {
        min-height: 100vh;
        color: #f4f4f5;
        background:
          radial-gradient(circle at top, rgba(239, 68, 68, 0.14), transparent 30rem),
          #09090b;
      }

      .auth-shell {
        min-height: calc(100vh - 3.5rem);
        display: grid;
        place-items: center;
        padding: 28px 16px;
      }

      .auth-card {
        width: min(100%, 380px);
        border: 1px solid #27272a;
        border-radius: 12px;
        background: #18181b;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
        padding: 28px 24px;
      }

      .brand {
        display: grid;
        justify-items: center;
        gap: 8px;
        width: fit-content;
        margin: 0 auto 20px;
        text-decoration: none;
      }

      .brand-mark {
        width: 48px;
        height: 48px;
        display: block;
        object-fit: contain;
      }

      .brand-name {
        display: block;
        text-align: center;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #ef4444;
      }

      .brand-tag {
        display: block;
        text-align: center;
        font-size: 11px;
        color: #a1a1aa;
      }

      .auth-card h1 {
        font-size: 22px;
        font-weight: 800;
        line-height: 1.15;
        text-align: center;
        margin: 0 0 8px;
        color: #f4f4f5;
      }

      .auth-sub {
        color: #a1a1aa;
        text-align: center;
        margin: 0 0 22px;
        font-size: 13px;
      }

      .field { margin: 0 0 12px; }
      .field label {
        display: block;
        font-weight: 650;
        font-size: 12px;
        margin-bottom: 6px;
        color: #e4e4e7;
      }

      .field input {
        width: 100%;
        height: 2.25rem;
        padding: 0 0.7rem;
        border-radius: 0.5rem;
        border: 1px solid #3f3f46;
        background: #09090b;
        color: #f4f4f5;
        font: inherit;
        font-size: 13px;
      }

      .field input:focus {
        outline: 0;
        border-color: #ef4444;
        box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.22);
      }

      .auth-button-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 2.25rem;
        border-radius: 0.5rem;
        border: 0;
        background: #ef4444;
        color: #ffffff;
        font-size: 13px;
        font-weight: 750;
        cursor: pointer;
        transition: background-color 150ms ease, transform 150ms ease;
      }

      .auth-button-primary:hover { background: #b91c1c; }
      .auth-button-primary:active { transform: translateY(1px); }
      .auth-button-primary:focus-visible {
        outline: 0;
        box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.22);
      }
      .auth-button-primary:disabled {
        background: #7f1d1d;
        cursor: not-allowed;
      }
      .hint { font-size: 12px; color: #a1a1aa; margin: 6px 0 14px; min-height: 18px; }
      .hint.bad { color: var(--danger); }
      .hint.good { color: #e4e4e7; }
      .row-links { text-align: center; margin-top: 16px; color: #71717a; font-size: 13px; }
      .row-links a { color: #f87171; text-decoration: none; }
      .row-links a:hover { color: #fca5a5; }
    </style>
    <link rel="stylesheet" href="/auth-page-theme.css" />
    <link rel="stylesheet" href="/site-header.css" />
    <script src="/site-header.js?v=2451d5d35a23" defer></script>
  </head>
  <body>
    <div data-forkmesh-header="simple"></div>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="forgot-title">
        <a class="brand" href="/dashboard" aria-label="BLT home">
          <img class="brand-mark" src="/assets/blt-logo.png" alt="" aria-hidden="true" />
          <span class="brand-name">BLT</span>
          <span class="brand-tag">OWASP Bug Logging Tool</span>
        </a>

      <h1 id="forgot-title">Reset your password</h1>
      <p class="auth-sub">Enter your email and we'll send you a reset link.</p>
      <div class="field">
        <label for="identifier">Email</label>
        <input class="auth-input-sm" id="identifier" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" />
      </div>
      <div class="hint" id="forgot-hint"></div>
      <button class="auth-button-primary btn-primary" id="forgot-btn">Send reset link</button>
      <p class="row-links">Remembered it? <a href="/login">Back to log in</a></p>
      </section>
    </main>
  </body>
</html>
