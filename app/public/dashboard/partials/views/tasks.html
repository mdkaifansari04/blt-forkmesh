          <section data-view="tasks" class="view active h-full overflow-y-auto">
            <div class="p-3 sm:p-6 w-full">
              <div data-tasks-panel class="w-full rounded-lg border border-border bg-card overflow-hidden">
                <div class="px-4 sm:px-5 py-4 border-b border-border flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3">
                  <div class="min-w-0">
                    <h1 class="text-base font-semibold text-foreground">Tasks</h1>
                    <p class="mt-1 text-sm text-muted-foreground">Your organization's private task catalog - the same list the desktop app and the World office board show. Task copy stays encrypted at rest and never leaves the organization.</p>
                  </div>
                  <div class="shrink-0 flex items-center gap-3 self-start">
                    <span data-tasks-count class="text-xs text-muted-foreground font-mono px-2.5 py-1 rounded-full border border-border bg-secondary">Loading</span>
                    <button
                      data-tasks-refresh
                      type="button"
                      class="inline-flex items-center gap-1.5 rounded-md border border-border px-3 py-1.5 text-xs font-semibold text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors"
                    >
                      <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                      Refresh
                    </button>
                  </div>
                </div>

                <div data-tasks-toolbar class="px-4 sm:px-5 py-3 border-b border-border flex flex-col gap-3 sm:flex-row sm:items-center">
                  <div class="relative flex-1 min-w-0">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-muted-foreground"></i>
                    <input
                      id="taskSearch"
                      data-tasks-search
                      type="text"
                      placeholder="Filter tasks by title, assignee, repository..."
                      class="w-full pl-9 pr-4 py-2 text-sm bg-background border border-border rounded-md text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-1 focus:ring-foreground/20 transition"
                    />
                  </div>
                  <div data-tasks-filters class="shrink-0 flex items-center gap-1 overflow-x-auto" role="group" aria-label="Filter tasks by status">
                    <button data-tasks-filter="open" type="button" aria-pressed="true" class="shrink-0 rounded-md border border-border px-3 py-1.5 text-xs text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors">Open</button>
                    <button data-tasks-filter="active" type="button" aria-pressed="false" class="shrink-0 rounded-md border border-border px-3 py-1.5 text-xs text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors">In progress</button>
                    <button data-tasks-filter="mine" type="button" aria-pressed="false" class="shrink-0 rounded-md border border-border px-3 py-1.5 text-xs text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors">Assigned to me</button>
                    <button data-tasks-filter="done" type="button" aria-pressed="false" class="shrink-0 rounded-md border border-border px-3 py-1.5 text-xs text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors">Done</button>
                    <button data-tasks-filter="all" type="button" aria-pressed="false" class="shrink-0 rounded-md border border-border px-3 py-1.5 text-xs text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors">All</button>
                  </div>
                </div>

                <div data-tasks-list class="divide-y divide-border" aria-live="polite">
                  <div class="px-4 sm:px-5 py-8 text-sm text-muted-foreground"><span class="fm-spinner" aria-hidden="true"></span>Loading organization tasks...</div>
                </div>

                <div data-tasks-pagination class="border-t border-border px-4 sm:px-5 py-3 flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
                  <span data-tasks-summary class="text-xs text-muted-foreground font-mono"></span>
                  <div class="flex items-center gap-2 overflow-x-auto">
                    <button data-tasks-prev type="button" class="shrink-0 inline-flex items-center gap-1 rounded-md border border-border px-3 py-1.5 text-xs text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors">
                      <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
                      Previous
                    </button>
                    <div data-tasks-pages class="flex items-center gap-1"></div>
                    <button data-tasks-next type="button" class="shrink-0 inline-flex items-center gap-1 rounded-md border border-border px-3 py-1.5 text-xs text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors">
                      Next
                      <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </section>
