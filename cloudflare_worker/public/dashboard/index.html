    <script>
      (() => {
        const key = "forkmesh.dashboard.theme";
        let theme = "dark";
        try {
          theme = localStorage.getItem(key) === "light" ? "light" : "dark";
        } catch (_) {}
        document.documentElement.dataset.dashboardTheme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "light" ? "#f6f8fb" : "#090909");
      })();
    </script>

              secondary: "rgb(var(--dashboard-secondary-rgb) / <alpha-value>)",

              muted: "rgb(var(--dashboard-muted-rgb) / <alpha-value>)",

	    <script>
      const avatarColors = ["#4ade80", "#818cf8", "#38bdf8", "#fb923c", "#f472b6", "#fbbf24"];

	      function setProfilePopoverOpen(open) {
	        const toggle = document.querySelector("[data-profile-toggle]");
	        const popover = document.querySelector("[data-profile-popover]");
	        if (!toggle || !popover) return;

	        popover.classList.toggle("hidden", !open);
	        toggle.setAttribute("aria-expanded", open ? "true" : "false");
		      }

	      function handleLogout() {
	        try {
	          localStorage.removeItem("forkmesh.session");
	        } catch (_) {}

	        document.cookie = "forkmesh_session=; Path=/; Max-Age=0; SameSite=Lax";
	        setProfilePopoverOpen(false);
	        window.location.href = window.location.protocol === "file:" ? "index.html" : "/";
	      }

	      function initProfileMenu() {
	        const toggle = document.querySelector("[data-profile-toggle]");
	        const popover = document.querySelector("[data-profile-popover]");
	        const logout = document.querySelector("[data-logout-button]");
	        if (!toggle || !popover || !logout) return;

	        toggle.addEventListener("click", (event) => {
	          event.stopPropagation();
	          setProfilePopoverOpen(popover.classList.contains("hidden"));
	        });

	        popover.addEventListener("click", (event) => {
	          event.stopPropagation();
	        });

	        logout.addEventListener("click", handleLogout);
	        document.addEventListener("click", () => setProfilePopoverOpen(false));
	        document.addEventListener("keydown", (event) => {
	          if (event.key === "Escape") setProfilePopoverOpen(false);
	        });
	      }

	      const contributionColors = ["#1c1c1f", "#14532d", "#166534", "#22c55e", "#4ade80"];

      function contributionLevel(index, year) {
        const seed = Number(year) || 2026;
        const value = (index * 17 + seed * 11 + Math.floor(index / 7) * 5) % 23;
        if (value < 4) return 0;
        if (value < 9) return 1;
        if (value < 15) return 2;
        if (value < 20) return 3;
        return 4;
      }

      function renderContributionGrid(year = "2026") {
        const grid = document.querySelector("[data-contribution-grid]");
        if (!grid) return;
        grid.innerHTML = "";

        for (let index = 0; index < 364; index += 1) {
          const level = contributionLevel(index, year);
          const cell = document.createElement("span");
          cell.setAttribute("aria-hidden", "true");
          cell.title = `${level} contributions`;
          cell.style.width = "10px";
          cell.style.height = "10px";
          cell.style.borderRadius = "2px";
          cell.style.background = contributionColors[level];
          grid.appendChild(cell);
        }
      }

      function setContributionYear(button) {
        document.querySelectorAll("[data-contribution-year]").forEach((yearButton) => {
          const active = yearButton === button;
          yearButton.classList.toggle("bg-primary", active);
          yearButton.classList.toggle("text-primary-foreground", active);
          yearButton.classList.toggle("font-semibold", active);
          yearButton.classList.toggle("text-muted-foreground", !active);
          yearButton.classList.toggle("hover:bg-secondary", !active);
          yearButton.classList.toggle("hover:text-foreground", !active);
        });

        const count = document.querySelector("[data-contribution-count]");
        if (count) count.textContent = button.dataset.count;
        renderContributionGrid(button.dataset.contributionYear);
      }

      function initContributionActivity() {
        const yearButtons = document.querySelectorAll("[data-contribution-year]");
        yearButtons.forEach((button) => {
          button.addEventListener("click", () => setContributionYear(button));
        });

        const activeYear = document.querySelector("[data-contribution-year].bg-primary") || yearButtons[0];
        if (activeYear) setContributionYear(activeYear);

        const showMoreButton = document.querySelector("[data-show-more-activity]");
        const moreActivity = document.querySelector("[data-more-activity]");
        if (showMoreButton && moreActivity) {
          showMoreButton.addEventListener("click", () => {
            const expanded = moreActivity.classList.toggle("hidden");
            showMoreButton.textContent = expanded ? "Show more activity" : "Show less activity";
          });
        }
      }

      function setSection(section) {
        document.querySelectorAll("[data-view]").forEach((view) => {
          view.classList.toggle("active", view.dataset.view === section);
        });
        document.querySelectorAll("[data-nav-link]").forEach((button) => {
          const active = button.dataset.section === section;
          button.setAttribute("aria-current", active ? "page" : "false");
          button.classList.toggle("text-foreground", active);
          button.classList.toggle("text-muted-foreground", !active);
          button.classList.toggle("hover:text-foreground", !active);
        });
      }

      function setNetworkRail(open) {
        document.body.classList.toggle("network-rail-collapsed", !open);
        document.querySelectorAll("[data-network-rail-toggle]").forEach((button) => {
          button.setAttribute("aria-expanded", open ? "true" : "false");
          button.setAttribute("aria-label", open ? "Close network panel" : "Open network panel");
        });
      }

      document.querySelectorAll("[data-section]").forEach((button) => {
        button.addEventListener("click", () => setSection(button.dataset.section));
      });

      document.querySelectorAll("[data-network-rail-toggle]").forEach((button) => {
        button.addEventListener("click", () => {
          setNetworkRail(document.body.classList.contains("network-rail-collapsed"));
        });
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") setProfilePopoverOpen(false);
      });

      const repoPageSize = 5;
      let repoCurrentPage = 1;
      let repoIsFetching = false;
      let repoFetchTimer;

      function repoCards() {
        return [...document.querySelectorAll(".repo-card")];
      }

      function repoQuery() {
        return document.getElementById("repoSearch").value.trim().toLowerCase();
      }

      function filteredRepoCards() {
        const query = repoQuery();
        return repoCards().filter((card) => !query || card.dataset.repo.includes(query));
      }

      function setRepoButtonDisabled(button, disabled) {
        if (!button) return;
        button.disabled = disabled;
        button.classList.toggle("opacity-40", disabled);
        button.classList.toggle("pointer-events-none", disabled);
      }

      function renderRepoPageButtons(totalPages) {
        const pages = document.querySelector("[data-repo-pages]");
        if (!pages) return;
        pages.innerHTML = "";

        for (let page = 1; page <= totalPages; page += 1) {
          const button = document.createElement("button");
          const active = page === repoCurrentPage;
          button.type = "button";
          button.setAttribute("data-repo-page-button", String(page));
          button.textContent = String(page);
          button.setAttribute("aria-label", `Show repository page ${page}`);
          button.setAttribute("aria-current", active ? "page" : "false");
          button.className = [
            "h-8 min-w-8 rounded-md border px-2 text-xs font-mono transition-colors",
            active
              ? "border-border bg-secondary text-foreground"
              : "border-transparent text-muted-foreground hover:border-border hover:bg-secondary hover:text-foreground",
          ].join(" ");
          button.disabled = repoIsFetching;
          button.addEventListener("click", () => setRepoPage(page));
          pages.appendChild(button);
        }
      }

      function applyRepoVisibility() {
        const list = document.getElementById("repoList");
        const cards = repoCards();
        const matchedCards = filteredRepoCards();
        const totalPages = Math.max(1, Math.ceil(matchedCards.length / repoPageSize));
        repoCurrentPage = Math.min(repoCurrentPage, totalPages);

        const start = (repoCurrentPage - 1) * repoPageSize;
        const end = Math.min(start + repoPageSize, matchedCards.length);
        const visibleCards = new Set(matchedCards.slice(start, end));

        cards.forEach((card) => {
          card.classList.toggle("is-hidden", !visibleCards.has(card));
        });

        list.classList.toggle("is-fetching", repoIsFetching);
        document.querySelector("[data-repo-loading]")?.classList.toggle("hidden", !repoIsFetching);

        const summary = document.querySelector("[data-repo-summary]");
        if (summary) {
          summary.textContent = matchedCards.length
            ? `Showing ${start + 1}-${end} of ${matchedCards.length} mirrored repositories`
            : "No repositories match this filter";
        }

        renderRepoPageButtons(totalPages);
        setRepoButtonDisabled(document.querySelector("[data-repo-prev]"), repoIsFetching || repoCurrentPage === 1);
        setRepoButtonDisabled(document.querySelector("[data-repo-next]"), repoIsFetching || repoCurrentPage === totalPages);
      }

      function setRepoPage(page, options = {}) {
        const totalPages = Math.max(1, Math.ceil(filteredRepoCards().length / repoPageSize));
        const targetPage = Math.min(Math.max(page, 1), totalPages);
        if (targetPage === repoCurrentPage && !options.force) return;

        window.clearTimeout(repoFetchTimer);
        if (options.instant) {
          repoCurrentPage = targetPage;
          repoIsFetching = false;
          applyRepoVisibility();
          return;
        }

        repoIsFetching = true;
        applyRepoVisibility();
        repoFetchTimer = window.setTimeout(() => {
          repoCurrentPage = targetPage;
          repoIsFetching = false;
          applyRepoVisibility();
        }, 220);
      }

      document.getElementById("repoSearch").addEventListener("input", () => {
        window.clearTimeout(repoFetchTimer);
        repoCurrentPage = 1;
        repoIsFetching = false;
        applyRepoVisibility();
      });

      document.querySelector("[data-repo-prev]")?.addEventListener("click", () => setRepoPage(repoCurrentPage - 1));
      document.querySelector("[data-repo-next]")?.addEventListener("click", () => setRepoPage(repoCurrentPage + 1));
      applyRepoVisibility();

      document.querySelectorAll("[data-view-mode]").forEach((button) => {
        button.addEventListener("click", () => {
          const mode = button.dataset.viewMode;
          const gridMode = mode === "grid";
          document.getElementById("repoList").classList.toggle("grid-mode", gridMode);
          document.querySelectorAll("[data-view-mode]").forEach((control) => {
            const active = control.dataset.viewMode === mode;
            control.setAttribute("aria-pressed", active ? "true" : "false");
            control.classList.toggle("bg-secondary", active);
            control.classList.toggle("text-foreground", active);
            control.classList.toggle("text-muted-foreground", !active);
          });
        });
      });

      document.querySelectorAll(".copy-button").forEach((button) => {
        button.addEventListener("click", async () => {
          const text = button.dataset.copy;
          try {
            await navigator.clipboard.writeText(text);
          } catch (error) {
            const temp = document.createElement("textarea");
            temp.value = text;
            temp.setAttribute("readonly", "");
            temp.style.position = "fixed";
            temp.style.opacity = "0";
            document.body.appendChild(temp);
            temp.select();
            document.execCommand("copy");
            temp.remove();
          }
          button.classList.add("copied");
          window.setTimeout(() => button.classList.remove("copied"), 1600);
        });
      });

      // Chat is wired by /dashboard-chat.js.
	      initProfileMenu();
	      initContributionActivity();
	      lucide.createIcons();
    </script>
  </body>
</html>
