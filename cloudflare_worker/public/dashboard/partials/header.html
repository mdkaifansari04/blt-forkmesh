      <header data-app-header class="relative h-14 flex items-center gap-3 px-4 shrink-0">
        <button
          data-mobile-menu-toggle
          type="button"
          aria-label="Open dashboard menu"
          aria-controls="dashboardSidebar"
          aria-expanded="false"
          class="items-center justify-center rounded-md border border-border bg-background p-2 text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors"
        >
          <i data-lucide="menu" class="h-4 w-4"></i>
        </button>

        <a class="brand flex items-center gap-2 shrink-0" href="/" aria-label="ForkMesh home">
          <img class="brand-mark h-8 w-8 object-contain" src="/assets/logo.png" alt="" aria-hidden="true" />
          <span
            data-app-version
            class="hidden rounded-full border border-border px-1.5 py-0.5 font-mono text-[10px] leading-none text-muted-foreground"
            title="ForkMesh version"
          ></span>
        </a>

        <div class="hidden min-w-0 items-center gap-2 text-sm font-semibold text-foreground sm:flex">
          <span data-dashboard-header-context class="min-w-0 truncate">Dashboard</span>
        </div>

        <div data-global-search-shell class="relative ml-auto hidden h-9 w-full max-w-sm min-w-0 items-center gap-2 rounded-md border border-border bg-background px-3 text-sm text-muted-foreground focus-within:border-ring focus-within:text-foreground lg:flex">
          <i data-lucide="search" class="h-4 w-4 shrink-0"></i>
          <input
            data-global-search
            id="globalSearchInput"
            type="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Type / to search"
            role="combobox"
            aria-autocomplete="list"
            aria-controls="globalSearchResults"
            aria-expanded="false"
            aria-keyshortcuts="/"
            class="min-w-0 flex-1 bg-transparent text-sm text-foreground outline-none placeholder:text-muted-foreground"
          />
          <span data-global-search-shortcut class="rounded border border-border px-1.5 py-0.5 font-mono text-[10px] leading-none text-muted-foreground">/</span>
          <div
            data-global-search-panel
            id="globalSearchResults"
            role="listbox"
            class="hidden absolute left-0 right-0 top-full z-50 mt-2 overflow-hidden rounded-lg border border-border bg-popover text-popover-foreground shadow-2xl shadow-background/50"
          >
            <div data-global-search-results class="max-h-96 overflow-y-auto py-1"></div>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <a
            href="/mirror-payouts"
            class="hidden h-9 w-9 items-center justify-center rounded-md border border-border bg-background text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors sm:inline-flex"
            title="Get paid to mirror code"
            aria-label="Get paid to mirror code"
          >
            <img src="/assets/sol.png" alt="" aria-hidden="true" class="h-4 w-4 shrink-0 rounded-full object-contain" />
          </a>

          <div class="relative">
            <button
              id="notificationToggle"
              type="button"
              aria-label="Open notifications"
              aria-expanded="false"
              class="relative flex h-9 w-9 items-center justify-center rounded-md border border-border bg-background text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors"
            >
              <i data-lucide="bell" class="w-4 h-4"></i>
              <span data-notification-badge class="hidden absolute -right-0.5 -top-0.5 h-2 w-2 rounded-full bg-accent"></span>
            </button>
            <div
              id="notificationDropdown"
              class="hidden absolute right-0 top-full mt-2 w-80 rounded-lg border border-border bg-card shadow-2xl shadow-background/40 overflow-hidden z-50"
            >
              <div class="px-3 py-2 border-b border-border flex items-center justify-between">
                <span class="text-xs font-medium text-foreground">Notifications</span>
                <span data-notification-count class="text-[10px] text-muted-foreground font-mono">0 new</span>
              </div>
              <div data-notification-preview-list class="py-1"></div>
              <div class="border-t border-border p-2">
                <button data-show-all-notifications type="button" class="w-full rounded-md px-3 py-2 text-center text-xs font-medium text-primary hover:bg-secondary transition-colors">
                  Show all notifications
                </button>
              </div>
            </div>
          </div>

          <div class="relative">
            <button
              id="agentModalToggle"
              type="button"
              aria-label="Start an agent"
              title="Start an agent"
              class="flex h-9 w-9 items-center justify-center rounded-md border border-border bg-background text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors"
            >
              <i data-lucide="bot" class="w-4 h-4"></i>
            </button>
            <div
              id="agentModal"
              class="hidden absolute right-0 top-full mt-2 w-96 max-w-[calc(100vw-2rem)] overflow-hidden rounded-lg border border-border bg-card shadow-2xl shadow-background/40 z-50"
              role="dialog"
              aria-labelledby="agentModalTitle"
            >
              <div class="flex items-center justify-between border-b border-border px-4 py-3">
                <div class="min-w-0">
                  <h2 id="agentModalTitle" class="flex items-center gap-2 text-sm font-semibold text-foreground"><i data-lucide="bot" class="h-4 w-4 text-primary"></i>Start an agent</h2>
                  <p class="mt-0.5 text-xs text-muted-foreground">Send a prompt to a fresh agent on the repository owner's node.</p>
                </div>
                <button data-agent-modal-close type="button" aria-label="Close start agent" class="rounded-md p-1.5 text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors">
                  <i data-lucide="x" class="h-4 w-4"></i>
                </button>
              </div>
              <form data-repo-agent-new-form class="grid gap-3 p-4">
                <label class="grid gap-1.5 text-xs text-muted-foreground">
                  Repository
                  <select data-agent-modal-repo class="h-9 rounded-md border border-border bg-background px-2 text-sm text-foreground outline-none focus:border-primary"></select>
                </label>
                <input data-repo-agent-new-input type="text" maxlength="8000" placeholder="Start a new agent - enter a prompt (paste a screenshot to attach)" class="h-9 min-w-0 rounded-md border border-border bg-background px-3 text-sm text-foreground outline-none placeholder:text-muted-foreground focus:border-primary" />
                <div class="flex items-center gap-2">
                  <button type="button" data-repo-agent-new-attach title="Attach a screenshot" class="inline-flex h-8 shrink-0 items-center gap-1.5 rounded-md border border-border px-2.5 text-xs font-medium text-foreground hover:bg-secondary"><i data-lucide="paperclip" class="h-3.5 w-3.5"></i>Attach</button>
                  <span class="text-[11px] text-muted-foreground">or paste a screenshot</span>
                </div>
                <input type="file" data-repo-agent-new-file-input multiple accept="image/png,image/jpeg,image/gif,image/webp" class="hidden" />
                <div data-repo-agent-new-attachments class="flex flex-wrap gap-2"></div>
                <div class="flex flex-wrap items-center gap-2">
                  <select data-repo-agent-new-provider title="Agent provider" class="h-8 shrink-0 rounded-md border border-border bg-background px-2 text-xs text-foreground outline-none focus:border-primary"></select>
                  <select data-repo-agent-new-model title="Agent model" class="h-8 shrink-0 rounded-md border border-border bg-background px-2 text-xs text-foreground outline-none focus:border-primary"></select>
                  <button type="submit" data-repo-agent-new-submit class="inline-flex h-8 shrink-0 items-center gap-1.5 rounded-md bg-primary px-2.5 text-xs font-medium text-primary-foreground transition-colors hover:bg-primary/90 disabled:opacity-50"><i data-lucide="plus" class="h-3.5 w-3.5"></i>Start agent</button>
                  <span data-repo-agent-new-hint class="text-[11px] text-muted-foreground"></span>
                </div>
              </form>
            </div>
          </div>

          <a
            data-guest-auth-link
            href="/signup"
            class="hidden ml-0.5 items-center whitespace-nowrap rounded-md bg-primary px-3 py-1.5 text-xs font-semibold text-primary-foreground hover:opacity-90 transition-opacity"
          >Sign Up / Log In</a>

          <a
            data-admin-button
            href="#"
            class="hidden ml-0.5 h-9 w-9 inline-flex items-center justify-center rounded-md border border-amber-500/30 bg-amber-500/10 text-amber-500 hover:bg-amber-500/20 transition-colors"
            title="Admin panel"
            aria-label="Admin panel"
          >
            <i data-lucide="shield-alert" class="h-4 w-4"></i>
          </a>

          <a
            data-node-reconnect
            href="/dashboard/settings"
            aria-label="Reconnect a node to this account"
            title="No node is connected to drain this account — link one to sync issues, chats and more"
            class="hidden ml-0.5 inline-flex items-center gap-1 rounded-full border border-amber-500/40 bg-amber-500/10 px-2 py-1 text-[11px] font-medium text-amber-600 hover:bg-amber-500/20 transition-colors focus:outline-none focus:ring-1 focus:ring-amber-500/30 dark:text-amber-400"
          >
            <i data-lucide="plug-zap" class="h-3.5 w-3.5"></i>
            <span>Reconnect node</span>
          </a>

          <a
            data-profile-settings-button
            href="/dashboard/settings"
            aria-label="Open profile settings"
            title="Profile settings"
            class="ml-0.5 flex items-center justify-center rounded-full hover:opacity-90 transition-opacity focus:outline-none focus:ring-1 focus:ring-foreground/20"
          >
            <span
              data-dashboard-profile-avatar
              class="avatar flex items-center justify-center rounded-full border shrink-0 font-mono font-semibold"
              style="width: 32px; height: 32px; background: #818cf822; border-color: #818cf850; color: #818cf8; font-size: 11px"
            >
              <img data-dashboard-profile-avatar-image class="hidden h-full w-full rounded-full object-cover" alt="" />
              <span data-avatar-initial>Y</span>
            </span>
            <span data-dashboard-profile-name class="sr-only">My Profile</span>
          </a>
        </div>
      </header>
