          <script>
            (() => {
              const params = new URLSearchParams(window.location.search);
              if (params.get("worldEmbed") !== "1") return;

              document.documentElement.dataset.worldEmbed = "1";
              document.documentElement.classList.remove("light");
              document.documentElement.classList.add("dark");
              document.documentElement.style.colorScheme = "dark";
              const viewportMeta = document.querySelector(
                'meta[name="viewport"]',
              );
              if (
                viewportMeta &&
                !viewportMeta.content.includes("viewport-fit=cover")
              ) {
                viewportMeta.content += ", viewport-fit=cover";
              }

              const styles = document.createElement("style");
              styles.dataset.dashboardChatEmbedStyles = "";
              styles.textContent = `
                html[data-world-embed="1"],
                html[data-world-embed="1"] body {
                  color-scheme: dark !important;
                  width: 100%;
                  height: 100vh;
                  height: var(--forkmesh-chat-viewport-height, 100dvh);
                  min-height: 0;
                  overflow: hidden;
                  --background: #0d1117;
                  --foreground: #f0f6fc;
                  --card: #0d1117;
                  --secondary: #161b22;
                  --muted: #161b22;
                  --muted-foreground: #8c959f;
                  --primary: #238636;
                  --primary-foreground: #ffffff;
                  --border: #30363d;
                  background: #0d1117 !important;
                  color: #f0f6fc !important;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    sans-serif !important;
                }

                html[data-world-embed="1"] [data-app-header],
                html[data-world-embed="1"] [data-dashboard-sidebar],
                html[data-world-embed="1"] [data-mobile-sidebar-backdrop] {
                  display: none !important;
                }

                html[data-world-embed="1"] [data-dashboard-root] {
                  height: 100vh !important;
                  height: var(--forkmesh-chat-viewport-height, 100dvh) !important;
                  max-height: var(--forkmesh-chat-viewport-height, 100dvh);
                  min-height: 0 !important;
                  overflow: hidden;
                }

                html[data-world-embed="1"] [data-dashboard-shell],
                html[data-world-embed="1"] [data-dashboard-main],
                html[data-world-embed="1"] #content,
                html[data-world-embed="1"] [data-dashboard-chat-view] {
                  height: 100%;
                  min-height: 0 !important;
                  overflow: hidden;
                }

                html[data-world-embed="1"] [data-dashboard-chat-view] {
                  display: flex;
                  flex-direction: column;
                  position: relative;
                  background: var(--background);
                  color: var(--foreground);
                }

                html[data-world-embed="1"] [data-dashboard-chat-channel-header] {
                  display: none;
                }

                html[data-world-embed="1"] #fullChatMessages {
                  min-height: 0;
                  padding-bottom: calc(
                    var(--forkmesh-chat-composer-height, 10.25rem) +
                    env(safe-area-inset-bottom, 0px)
                  );
                  overflow-y: auto;
                  overscroll-behavior-y: contain;
                  -webkit-overflow-scrolling: touch;
                  background: #0d1117 !important;
                  color: #f0f6fc !important;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    sans-serif !important;
                }

                html[data-world-embed="1"] #fullChatMessages p {
                  color: #c9d1d9 !important;
                }

                html[data-world-embed="1"] #fullChatMessages .text-foreground {
                  color: #f0f6fc !important;
                }

                html[data-world-embed="1"] #fullChatMessages .text-muted-foreground,
                html[data-world-embed="1"] #fullChatMessages .text-muted-foreground\\/50 {
                  color: #8c959f !important;
                }

                html[data-world-embed="1"] #fullChatMessages .text-primary {
                  color: #3fb950 !important;
                }

                html[data-world-embed="1"] [data-dashboard-chat-composer] {
                  position: absolute;
                  z-index: 1;
                  right: 0;
                  bottom: 0;
                  left: 0;
                  box-sizing: border-box;
                  max-width: 100%;
                  overflow: hidden;
                  padding-right: max(0.75rem, env(safe-area-inset-right, 0px));
                  padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
                  padding-left: max(0.75rem, env(safe-area-inset-left, 0px));
                  background: rgb(13 17 23 / 0.72) !important;
                  color: #f0f6fc !important;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    sans-serif !important;
                  backdrop-filter: blur(18px) saturate(1.15);
                }

                html[data-world-embed="1"] [data-dashboard-chat-composer] > div,
                html[data-world-embed="1"] [data-dashboard-chat-composer-toolbar],
                html[data-world-embed="1"] [data-dashboard-chat-composer] select,
                html[data-world-embed="1"] [data-dashboard-chat-composer] textarea {
                  border-color: #30363d !important;
                  background: rgb(22 27 34 / 0.78) !important;
                  color: #f0f6fc !important;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    sans-serif !important;
                }

                html[data-world-embed="1"] [data-dashboard-chat-composer] textarea {
                  background: rgb(13 17 23 / 0.46) !important;
                }

                html[data-world-embed="1"] [data-dashboard-chat-composer] textarea::placeholder {
                  color: #8c959f !important;
                }

                html[data-world-embed="1"] [data-dashboard-chat-composer-toolbar] {
                  display: grid;
                  grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
                }

                html[data-world-embed="1"] [data-dashboard-chat-action] {
                  grid-column: 1 / -1;
                  width: 100%;
                }

                html[data-world-embed="1"] [data-dashboard-task-routing][hidden] {
                  display: none !important;
                }

                html[data-world-embed="1"] [data-dashboard-task-routing] {
                  grid-column: 1 / -1;
                  display: grid;
                  grid-template-columns: repeat(2, minmax(0, 1fr));
                  gap: 0.375rem;
                }

                html[data-world-embed="1"] [data-dashboard-chat-compose-row] {
                  display: grid;
                  grid-template-columns: minmax(0, 1fr) auto auto;
                  align-items: end;
                }

                html[data-world-embed="1"] #fullChatSend,
                html[data-world-embed="1"] #fullChatTaskSend {
                  box-sizing: border-box;
                  width: 2.75rem !important;
                  min-width: 2.75rem;
                  max-width: 2.75rem;
                  height: 2.75rem;
                  justify-content: center;
                  border-radius: 999px;
                  color: #ffffff !important;
                  background: #238636 !important;
                  white-space: nowrap;
                }

                html[data-world-embed="1"] #fullChatTaskSend {
                  border: 1px solid #58a6ff !important;
                  color: #dbeafe !important;
                  background: rgb(31 111 235 / 0.5) !important;
                }

                html[data-world-embed="1"] :is(#fullChatSend, #fullChatTaskSend) span {
                  position: absolute;
                  width: 1px;
                  height: 1px;
                  overflow: hidden;
                  clip: rect(0 0 0 0);
                  white-space: nowrap;
                }

                @media (max-width: 767px), (pointer: coarse) {
                  html[data-world-embed="1"] #fullChatInput {
                    min-height: 2.75rem;
                    font-size: 16px;
                  }

                  html[data-world-embed="1"] #fullChatSend,
                  html[data-world-embed="1"] #fullChatTaskSend {
                    width: 2.75rem !important;
                    min-width: 2.75rem;
                    height: 2.75rem;
                  }
                }
              `;
              document.head.append(styles);

              const syncWorldEmbedViewport = () => {
                /*
                 * In an iframe, some mobile engines expose the top-level
                 * visualViewport height even when this frame is shorter. Never
                 * let that value make the chat root taller than its own layout
                 * viewport; a smaller visual viewport (the software keyboard)
                 * is still honored.
                 */
                const layoutHeight = window.innerHeight;
                const visualHeight = window.visualViewport?.height;
                const frameHeight =
                  window.frameElement?.getBoundingClientRect?.().height;
                const candidates = [
                  layoutHeight,
                  visualHeight,
                  frameHeight,
                ].filter(
                  (value) => Number.isFinite(value) && value > 0,
                );
                const height = candidates.length
                  ? Math.min(...candidates)
                  : 0;
                if (!Number.isFinite(height) || height <= 0) return;
                document.documentElement.style.setProperty(
                  "--forkmesh-chat-viewport-height",
                  `${Math.round(height)}px`,
                );
              };

              syncWorldEmbedViewport();
              window.visualViewport?.addEventListener(
                "resize",
                syncWorldEmbedViewport,
                { passive: true },
              );
              window.visualViewport?.addEventListener(
                "scroll",
                syncWorldEmbedViewport,
                { passive: true },
              );
              window.addEventListener("resize", syncWorldEmbedViewport, {
                passive: true,
              });
              window.addEventListener("DOMContentLoaded", () => {
                const composer = document.querySelector(
                  "[data-dashboard-chat-composer]",
                );
                if (!composer || typeof ResizeObserver !== "function") return;
                const observer = new ResizeObserver(([entry]) => {
                  const height = Math.ceil(
                    entry?.borderBoxSize?.[0]?.blockSize ||
                      entry?.contentRect?.height ||
                      composer.getBoundingClientRect().height,
                  );
                  if (height > 0) {
                    document.documentElement.style.setProperty(
                      "--forkmesh-chat-composer-height",
                      `${height}px`,
                    );
                  }
                });
                observer.observe(composer);
              }, { once: true });
            })();
          </script>

          <section data-view="chat" data-dashboard-chat-view class="view active flex-view h-full min-h-0 flex-col overflow-hidden">
            <div data-dashboard-chat-channel-header class="px-5 py-3.5 border-b border-border flex items-center gap-2 shrink-0">
              <i data-lucide="hash" class="w-4 h-4 text-muted-foreground"></i>
              <span class="text-sm font-semibold text-foreground">general</span>
              <i data-lucide="lock" class="w-3 h-3 text-muted-foreground ml-1"></i>
              <span class="ml-auto flex items-center gap-1.5 text-xs text-muted-foreground">
                <i data-lucide="circle" class="w-1.5 h-1.5 fill-primary text-primary"></i>
                <span data-dashboard-chat-status class="font-mono">Not connected</span>
              </span>

            <div id="fullChatMessages" class="flex-1 overflow-y-scroll px-4 py-3 flex flex-col gap-1 min-h-0"></div>

                    <option value="code-planet"># world-code-planet</option>
                    <option value="organization-region"># world-organization-region</option>
                    <option value="planet-atlas"># world-planet-atlas</option>
                    <option value="neighborhood"># world-neighborhood</option>
                    <option value="broadcast"># world-broadcast</option>
                  </select>
                  <label class="sr-only" for="fullChatRepo">Repository</label>
                  <select id="fullChatRepo" data-dashboard-chat-repository class="h-7 min-w-0 flex-1 rounded-md border border-border bg-background px-2 text-xs text-foreground outline-none hover:bg-secondary focus:ring-1 focus:ring-primary">
                    <option value="">No repository</option>
                  </select>
                  <label class="sr-only" for="fullChatAction">Composer action</label>
                  <select id="fullChatAction" data-dashboard-chat-action class="h-7 rounded-md border border-border bg-background px-2 text-xs font-semibold text-foreground outline-none hover:bg-secondary focus:ring-1 focus:ring-primary">
                    <option value="chat">Send to chat</option>
                    <option value="task">Create team task</option>
                    <option value="issue">Create repository issue</option>
                    <option value="codex">Assign Codex</option>
                    <option value="claude-code">Assign Claude</option>
                  </select>
                  <div data-dashboard-task-routing hidden class="contents">
                    <label class="sr-only" for="fullTaskDepartment">Task department</label>
                    <select id="fullTaskDepartment" data-dashboard-task-department class="h-7 rounded-md border border-border bg-background px-2 text-xs text-foreground outline-none hover:bg-secondary focus:ring-1 focus:ring-primary">
                      <option value="general">General</option>
                      <option value="marketing">Marketing</option>
                      <option value="engineering">Engineering</option>
                      <option value="product-design">Product + design</option>
                      <option value="security">Security</option>
                      <option value="infrastructure">Infrastructure</option>
                      <option value="community">Community</option>
                      <option value="partnerships">Partnerships</option>
                      <option value="operations">Operations</option>
                      <option value="executive">Executive</option>
                      <option value="quality-assurance">Quality assurance</option>
                    </select>
                    <label class="sr-only" for="fullTaskTeam">Task team</label>
                    <select id="fullTaskTeam" data-dashboard-task-team class="h-7 rounded-md border border-border bg-background px-2 text-xs text-foreground outline-none hover:bg-secondary focus:ring-1 focus:ring-primary">
                      <option value="">Choose a team</option>
                    </select>
                    <label class="sr-only" for="fullTaskDestination">Task destination</label>
                    <select id="fullTaskDestination" data-dashboard-task-destination class="h-7 rounded-md border border-border bg-background px-2 text-xs text-foreground outline-none hover:bg-secondary focus:ring-1 focus:ring-primary">

                      <option value="repository">Repository</option>

                    </select>
                    <label class="sr-only" for="fullTaskAssignee">Task assignee</label>
                    <select id="fullTaskAssignee" data-dashboard-task-assignee class="h-7 rounded-md border border-border bg-background px-2 text-xs text-foreground outline-none hover:bg-secondary focus:ring-1 focus:ring-primary">

                  </div>
                </div>
                <div data-dashboard-chat-compose-row class="flex items-end gap-2 px-2 py-2">
                  <textarea
                    id="fullChatInput"
                    aria-label="Message #general"
                    enterkeyhint="send"
                    rows="2"
                    maxlength="16000"
                    class="max-h-32 min-h-12 min-w-0 flex-1 resize-none bg-transparent px-1 py-1 text-sm leading-5 text-foreground placeholder:text-muted-foreground focus:outline-none"
