<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="/posthog.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password · ForkMesh</title>
    <meta name="description" content="Request a password reset link for your ForkMesh account." />
    <meta name="application-name" content="ForkMesh" />
    <meta name="apple-mobile-web-app-title" content="ForkMesh" />
    <meta name="theme-color" content="#090909" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <script src="/forgot-password.js?v=auth-simple-1" defer></script>
    <style>
      body {
        min-height: 100vh;
        color: #f5f5f5;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.16), transparent 30rem),
          #050505;
      }

      .auth-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px 16px;
      }

      .auth-card {
        width: min(100%, 380px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 18px;
        background: rgba(8, 8, 8, 0.88);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
        padding: 22px;
      }

      .brand {
        width: fit-content;
        margin: 0 auto 22px;
      }

      .auth-card h1 {
        font-size: 24px;
        font-weight: 800;
        line-height: 1.08;
        text-align: center;
        margin: 0 0 8px;
        color: #ffffff;
      }

      .auth-sub {
        color: rgba(255, 255, 255, 0.62);
        text-align: center;
        margin: 0 0 20px;
        font-size: 13px;
      }

      .field { margin: 0 0 12px; }
      .field label {
        display: block;
        font-weight: 650;
        font-size: 12px;
        margin-bottom: 6px;
        color: rgba(255, 255, 255, 0.82);
      }

      .field input {
        width: 100%;
        height: 2.25rem;
        padding: 0 0.7rem;
        border-radius: 0.75rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.055);
        color: #f5f5f5;
        font: inherit;
        font-size: 13px;
      }

      .field input:focus {
        outline: 0;
        border-color: rgba(255, 255, 255, 0.34);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.12);
      }

      .auth-button-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 2.25rem;
        border-radius: 0.75rem;
        border: 0;
        background: #f5f5f5;
        color: #050505;
        font-size: 13px;
        font-weight: 750;
        cursor: pointer;
        transition: transform 150ms ease, background-color 150ms ease, color 150ms ease;
      }

      .auth-button-primary:hover {
        background: #d9d9d9;
        color: #050505;
      }

      .auth-button-primary:active {
        transform: translateY(1px);
      }

      .auth-button-primary:focus-visible {
        outline: 0;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.12);
      }

      .auth-button-primary:disabled {
        background: #e6e6e6;
        color: #050505;
        cursor: not-allowed;
      }
      .hint { font-size: 12px; color: rgba(255, 255, 255, 0.62); margin: 6px 0 14px; min-height: 18px; }
      .hint.bad { color: var(--danger); }
      .hint.good { color: rgba(255, 255, 255, 0.82); }
      .row-links { text-align: center; margin-top: 16px; color: rgba(255, 255, 255, 0.58); font-size: 13px; }
      .row-links a { color: #ffffff; }
    </style>
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="forgot-title">
        <a class="brand" href="/" aria-label="ForkMesh home">
          <img class="brand-mark" src="/assets/logo.png" alt="" aria-hidden="true" />
        </a>

      <h1 id="forgot-title">Reset your password</h1>
      <p class="auth-sub">Enter your email and we'll send you a reset link.</p>
      <div class="field">
        <label for="identifier">Email</label>
        <input class="auth-input-sm" id="identifier" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" />
      </div>
      <div class="hint" id="forgot-hint"></div>
      <button class="auth-button-primary btn-primary" id="forgot-btn">Send reset link</button>
      <p class="row-links">Remembered it? <a href="/login.html">Back to log in</a></p>
      </section>
    </main>
  </body>
</html>
