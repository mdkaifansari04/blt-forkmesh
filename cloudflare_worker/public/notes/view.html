<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ForkMesh note</title>
<style>:root{color-scheme:light dark;font:16px/1.65 system-ui,sans-serif;background:#0b0d12;color:#e9edf5}body{margin:0}.bar{border-bottom:1px solid #293041;padding:14px 22px}.bar a{color:inherit;text-decoration:none;font-weight:700}.page{max-width:860px;margin:42px auto;padding:0 22px}.meta{color:#939db0;font-size:13px}.content{margin-top:28px}.content pre{overflow:auto;padding:14px;border:1px solid #293041;border-radius:8px;background:#121722}.content code{font-family:ui-monospace,monospace}.content a{color:#78a9ff}.content blockquote{border-left:3px solid #59647a;margin-left:0;padding-left:16px;color:#adb6c6}.error{color:#ff9c9c}</style></head>
<body><header class="bar"><a href="/">ForkMesh</a></header><main class="page"><h1 id="title">Loading note…</h1><div id="meta" class="meta"></div><article id="content" class="content"></article></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function md(raw){const lines=String(raw||"").replace(/\r/g,"").split("\n"),out=[];let code=false,buf=[];for(const line of lines){if(/^```/.test(line)){if(code){out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);buf=[]}code=!code;continue}if(code){buf.push(line);continue}const h=line.match(/^(#{1,6})\s+(.+)/);if(h){out.push(`<h${h[1].length}>${esc(h[2])}</h${h[1].length}>`);continue}if(/^>\s?/.test(line)){out.push(`<blockquote>${esc(line.replace(/^>\s?/,""))}</blockquote>`);continue}const li=line.match(/^\s*[-*+]\s+(.+)/);if(li){out.push(`<ul><li>${esc(li[1])}</li></ul>`);continue}if(!line.trim()){out.push("");continue}let safe=esc(line).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" rel="nofollow noopener">$1</a>');out.push(`<p>${safe}</p>`)}if(code)out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);return out.join("")}
(async()=>{const id=location.pathname.split("/").filter(Boolean).pop();try{const response=await fetch(`/api/notes/${id}`,{headers:{accept:"application/json"}}),data=await response.json();if(!response.ok)throw new Error(data.error||"Note unavailable");const note=data.note;document.title=`${note.title} · ForkMesh`;document.querySelector("#title").textContent=note.title;document.querySelector("#meta").textContent=`Published on ForkMesh · version ${note.version} · updated ${new Date(note.updatedAt).toLocaleString()}`;document.querySelector("#content").innerHTML=md(note.markdown)}catch(error){document.querySelector("#title").textContent="Note unavailable";document.querySelector("#content").textContent="This note is private, missing, or no longer published.";document.querySelector("#content").className="content error"}})();
</script></body></html>
