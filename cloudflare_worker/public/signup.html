<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="/posthog.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account · ForkMesh</title>
    <meta
      name="description"
      content="Create a ForkMesh account with your email, password, and username. Add payout details later from your dashboard profile."
    />
    <meta name="application-name" content="ForkMesh" />
    <meta name="apple-mobile-web-app-title" content="ForkMesh" />
    <meta name="theme-color" content="#090909" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <script src="/signup.js?v=auth-simple-3" defer></script>
    <style>
      body {
        min-height: 100vh;
        color: #f5f5f5;
        background:
          radial-gradient(
            circle at top,
            rgba(255, 255, 255, 0.16),
            transparent 32rem
          ),
          #050505;
      }

      .auth-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px 16px;
      }

      .auth-card {
        width: min(100%, 520px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 18px;
        background: rgba(8, 8, 8, 0.88);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
        padding: 22px;
      }

      .auth-card .brand {
        width: fit-content;
        margin: 0 auto 18px;
      }

      .auth-button-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 2.25rem;
        border-radius: 0.75rem;
        border: 0;
        background: #f5f5f5;
        color: #050505;
        font-size: 13px;
        font-weight: 750;
        cursor: pointer;
        transition:
          transform 150ms ease,
          background-color 150ms ease,
          color 150ms ease;
      }

      .auth-button-primary:hover {
        background: #d9d9d9;
        color: #050505;
      }

      .auth-button-primary:active {
        transform: translateY(1px);
      }

      .auth-button-primary:focus-visible {
        outline: 0;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.12);
      }

      .auth-button-primary:disabled {
        background: #e6e6e6;
        color: #050505;
        cursor: not-allowed;
      }

      .auth-input-sm {
      }

      .join-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: rgba(255, 255, 255, 0.7);
        font-weight: 650;
        font-size: 12px;
        justify-content: center;
        width: 100%;
      }
      .join-title {
        font-size: clamp(26px, 6vw, 38px);
        font-weight: 800;
        line-height: 1.04;
        text-align: center;
        margin: 8px 0 10px;
        color: #ffffff;
      }
      .join-sub {
        color: rgba(255, 255, 255, 0.62);
        text-align: center;
        max-width: 460px;
        margin: 0 auto 16px;
        line-height: 1.5;
        font-size: 13px;
      }
      .join-banner {
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
        border-radius: 12px;
        padding: 12px;
        text-align: center;
        margin: 0 0 16px;
      }
      .join-banner strong {
        color: #ffffff;
        font-size: 14px;
      }
      .join-banner span {
        display: block;
        color: rgba(255, 255, 255, 0.62);
        margin-top: 4px;
        font-size: 12px;
      }
      .field {
        margin: 0 0 12px;
      }
      .field label {
        display: block;
        font-weight: 650;
        margin-bottom: 6px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.82);
      }
      .field input {
        width: 100%;
        height: 2.25rem;
        padding: 0 0.7rem;
        border-radius: 0.75rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.055);
        color: #f5f5f5;
        font: inherit;
        font-size: 13px;
      }
      .field input:focus {
        outline: 0;
        border-color: rgba(255, 255, 255, 0.34);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.12);
      }
      .hint {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.62);
        margin-top: 6px;
      }
      .hint.bad {
        color: var(--danger);
      }
      .hint.good {
        color: rgba(255, 255, 255, 0.82);
      }
      .terms-check {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin: 0 0 14px;
        color: rgba(255, 255, 255, 0.7);
        font-size: 12px;
        line-height: 1.4;
        cursor: pointer;
      }
      .terms-check input {
        margin: 2px 0 0;
        accent-color: #f5f5f5;
        cursor: pointer;
      }
      .terms-check a {
        color: #ffffff;
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 2.25rem;
        padding: 0 1rem;
        border-radius: 0.75rem;
        border: 0;
        background: #f5f5f5;
        color: #050505;
        font-weight: 750;
        font-size: 13px;
        cursor: pointer;
      }
      .row-links {
        text-align: center;
        margin-top: 14px;
        color: rgba(255, 255, 255, 0.58);
        font-size: 13px;
      }
      .row-links a {
        color: #ffffff;
      }

      @media (max-width: 620px) {
        .auth-card {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="signup-title">
        <a class="brand" href="/" aria-label="ForkMesh home">
          <img
            class="brand-mark"
            src="/assets/logo.png"
            alt=""
            aria-hidden="true"
          />
        </a>
        <h1 id="signup-title" class="join-title">Join ForkMesh</h1>
        <form id="signup-form" novalidate>
          <div class="field">
            <label for="acct-email">Email</label>
            <input
              class="auth-input-sm"
              id="acct-email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
            />
          </div>
          <div class="field">
            <label for="acct-pass">Password</label>
            <input
              class="auth-input-sm"
              id="acct-pass"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="At least 8 characters"
            />
          </div>
          <div class="field">
            <label for="node-name">Username</label>
            <input
              class="auth-input-sm"
              id="node-name"
              name="nodeName"
              type="text"
              inputmode="latin"
              autocomplete="username"
              spellcheck="false"
              placeholder="e.g. ada-lovelace"
              maxlength="63"
            />
            <div class="hint" id="name-hint"></div>
          </div>
          <label class="terms-check" for="terms-agree">
            <input type="checkbox" id="terms-agree" />
            <span
              >I agree to the <a href="/terms">Terms</a> and
              <a href="/privacy">Privacy</a>.</span
            >
          </label>
          <div class="hint" id="signup-hint"></div>
          <button
            class="auth-button-primary btn-primary"
            id="signup-create"
            type="submit"
            disabled
          >
            Create account
          </button>
        </form>
        <p class="row-links">
          Already have an account? <a href="/login">Log in</a>
        </p>
      </section>
    </main>
  </body>
</html>
