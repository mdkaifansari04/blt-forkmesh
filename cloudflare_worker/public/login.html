<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="/posthog.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in · ForkMesh</title>
    <meta name="description" content="Log in to ForkMesh with your node identity to manage mirrors, repositories, and signed collaboration." />
    <meta name="application-name" content="ForkMesh" />
    <meta name="apple-mobile-web-app-title" content="ForkMesh" />
    <meta name="theme-color" content="#090909" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <script src="/login.js?v=ea5ab59ec7b9" defer></script>
    <style>
      body {
        min-height: 100vh;
        color: #f5f5f5;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.16), transparent 30rem),
          #050505;
      }

      .auth-shell {
        min-height: calc(100vh - 3.5rem);
        display: grid;
        place-items: center;
        padding: 28px 16px;
      }

      .auth-card {
        width: min(100%, 380px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 18px;
        background: rgba(8, 8, 8, 0.88);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
        padding: 22px;
      }

      .brand {
        width: fit-content;
        margin: 0 auto 22px;
      }

      .auth-card h1 {
        font-size: 24px;
        font-weight: 800;
        line-height: 1.08;
        text-align: center;
        margin: 0 0 8px;
        color: #ffffff;
      }

      .auth-sub {
        color: rgba(255, 255, 255, 0.62);
        text-align: center;
        margin: 0 0 20px;
        font-size: 13px;
      }

      .field { margin: 0 0 12px; }
      .field label {
        display: block;
        font-weight: 650;
        font-size: 12px;
        margin-bottom: 6px;
        color: rgba(255, 255, 255, 0.82);
      }

      .field input {
        width: 100%;
        height: 2.25rem;
        padding: 0 0.7rem;
        border-radius: 0.75rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.055);
        color: #f5f5f5;
        font: inherit;
        font-size: 13px;
      }

      .field input:focus {
        outline: 0;
        border-color: rgba(255, 255, 255, 0.34);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.12);
      }

      .auth-input-sm {}

      .auth-button-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 2.25rem;
        border-radius: 0.75rem;
        border: 0;
        background: #f5f5f5;
        color: #050505;
        font-size: 13px;
        font-weight: 750;
        cursor: pointer;
        transition: transform 150ms ease, background-color 150ms ease, color 150ms ease;
      }

      .auth-button-primary:hover {
        background: #d9d9d9;
        color: #050505;
      }

      .auth-button-primary:active {
        transform: translateY(1px);
      }

      .auth-button-primary:focus-visible {
        outline: 0;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.12);
      }

      .auth-button-primary:disabled {
        background: #e6e6e6;
        color: #050505;
        cursor: not-allowed;
      }
      .hint { font-size: 12px; color: rgba(255, 255, 255, 0.62); margin: 6px 0 14px; min-height: 18px; }
      .hint.bad { color: var(--danger); }
      .hint.good { color: rgba(255, 255, 255, 0.82); }
      .row-links { text-align: center; margin-top: 16px; color: rgba(255, 255, 255, 0.58); font-size: 13px; }
      .row-links a { color: #ffffff; }
      .demo-credentials {
        display: none;
        margin: 0 0 14px;
        padding: 10px 12px;
        border: 1px solid rgba(63, 185, 80, 0.22);
        border-radius: 12px;
        background: rgba(63, 185, 80, 0.07);
        color: rgba(255, 255, 255, 0.72);
        font-size: 12px;
        line-height: 1.5;
      }
      .demo-credentials strong { color: #ffffff; }
      .demo-credentials code { color: #ffffff; }
      .demo-credentials button {
        margin-top: 8px;
        width: 100%;
        height: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }
      #totp-field { display: none; }
    </style>
    <link rel="stylesheet" href="/auth-page-theme.css" />
    <link rel="stylesheet" href="/site-header.css" />
    <script src="/site-header.js?v=48c851a962ec" defer></script>
  </head>
  <body>
    <div data-forkmesh-header="simple"></div>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="login-title">
        <a class="brand" href="/" aria-label="ForkMesh home">
          <img class="brand-mark" src="/assets/logo.png" alt="" aria-hidden="true" />
        </a>

      <h1 id="login-title">Welcome back</h1>
      <p class="auth-sub">Manage repositories, mirrors, payouts, and signed collaboration.</p>
      <div class="field">
        <label for="email">Email</label>
        <input class="auth-input-sm" id="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="auth-input-sm" id="password" type="password" autocomplete="current-password" placeholder="Your password" />
      </div>
      <div class="field" id="totp-field">
        <label for="totp">Authenticator code</label>
        <input class="auth-input-sm" id="totp" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" maxlength="6" />
      </div>
      <div class="demo-credentials" id="demo-credentials">
        <strong>Local demo login</strong><br />
        Email: <code>demo@forkmesh.local</code><br />
        Password: <code>forkmesh-demo</code>
        <button type="button" id="demo-fill-btn">Use demo credentials</button>
      </div>
      <div class="hint" id="login-hint"></div>
      <button class="auth-button-primary btn-primary" id="login-btn">Log in</button>
      <p class="row-links"><a href="/forgot-password">Forgot your password?</a></p>
      <p class="row-links">New to ForkMesh? <a href="/signup">Create an account</a></p>
      </section>
    </main>
  </body>
</html>
