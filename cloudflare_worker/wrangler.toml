name = "forkmesh-relay"
main = "src/entry.py"
compatibility_flags = [ "python_workers", "disable_python_external_sdk" ]
compatibility_date = "2026-06-14"

[assets]
directory = "./public"
run_worker_first = ["/api/*", "/health", "/*/info/refs", "/*/git-upload-pack"]

[vars]
NODE_NAME = "forkmesh-mainnode"
NODE_BCH_ADDRESS = ""
# Encrypts account emails at rest. Override in production with a real secret:
#   uvx --from workers-py pywrangler secret put ACCOUNTS_KEY
ACCOUNTS_KEY = "forkmesh-dev-accounts-key-change-me"

[[durable_objects.bindings]]
name = "FORKMESH_MAINNODE_ROOM"
class_name = "ForkMeshRoom"

[[durable_objects.bindings]]
name = "FORKMESH_CATALOG"
class_name = "ForkMeshCatalog"

[[durable_objects.bindings]]
name = "FORKMESH_FILES"
class_name = "ForkMeshFiles"

[[durable_objects.bindings]]
name = "FORKMESH_HOST"
class_name = "ForkMeshHost"

[[durable_objects.bindings]]
name = "FORKMESH_ACCOUNTS"
class_name = "ForkMeshAccounts"

[[durable_objects.bindings]]
name = "FORKMESH_ISSUES"
class_name = "ForkMeshIssues"

[[durable_objects.bindings]]
name = "FORKMESH_PULLS"
class_name = "ForkMeshPulls"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ForkMeshRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ForkMeshCatalog"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ForkMeshFiles"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ForkMeshHost"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["ForkMeshAccounts"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["ForkMeshIssues"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["ForkMeshPulls"]


[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

