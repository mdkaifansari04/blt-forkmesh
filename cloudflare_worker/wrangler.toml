name = "forkmesh-relay"
main = "src/entry.py"
compatibility_flags = [ "python_workers", "disable_python_external_sdk" ]
compatibility_date = "2026-06-14"

# Runs automatically before every deploy: applies the D1 schema (idempotent).
[build]
command = "./migrate.sh"

# Per-minute cron: the Worker's scheduled() handler samples how many nodes are
# online and records it for the /network/ 24-hour activity graph.
[triggers]
crons = ["* * * * *"]

[assets]
directory = "./public"
# Clean repo URLs (/owner/name, /owner/name/tree/..., /owner/name/blob/...) are
# client-side routes with no matching asset file, so serve index.html for any
# unmatched path and let catalog.js route it. Real assets still take priority,
# and git/API paths below are handled by the worker first.
not_found_handling = "single-page-application"
# /admin-* always hits the worker so the secret admin path (ADMIN_PATH) is
# handled in code rather than served as a static asset.
run_worker_first = ["/api/*", "/health", "/network", "/docs", "/*/info/refs", "/*/git-upload-pack", "/admin-*"]

[vars]
NODE_NAME = "forkmesh-mainnode"
NODE_SOLANA_ADDRESS = ""
# TREASURY_SOLANA_ADDRESS (receives join donations directly with per-account
# payment references) is NOT here — it lives in .env.production and is pushed as
# a Worker secret by deploy.sh, so it isn't committed and can't be wiped by a
# deploy. Falls back to NODE_SOLANA_ADDRESS when unset.
# Admins are set in the database, not here: the accounts table has an is_admin
# column. Grant one with: UPDATE accounts SET is_admin=1 WHERE name='<node>'.
# Encrypts ALL D1 data at rest (AES-GCM row blobs) and derives the blind-index
# HMAC key. Security-critical — override in production with a real secret:
#   uvx --from workers-py pywrangler secret put DATA_KEY
DATA_KEY = "forkmesh-dev-data-key-change-me"
# Legacy: still referenced if present; DATA_KEY supersedes it.
ACCOUNTS_KEY = "forkmesh-dev-accounts-key-change-me"
# Admin error dashboard creds (ADMIN_PATH / ADMIN_USER / ADMIN_PASS) are kept out
# of this committed file. They live in .env.production (gitignored) and are pushed
# as Worker *secrets* by deploy.sh (`pywrangler secret put`) — NOT plaintext vars,
# which get wiped on any deploy that doesn't re-declare them. Secrets persist
# across deploys. See .env.production.example. ADMIN_PATH must start with "admin-"
# so it is routed to the worker (see run_worker_first above); the dashboard is
# then served at https://<host>/<ADMIN_PATH> behind HTTP Basic auth.

# Durable Objects are used only for transient relaying now: the encrypted chat
# rooms and the live file/git tunnel. All persistent data lives in D1 below.
[[durable_objects.bindings]]
name = "FORKMESH_MAINNODE_ROOM"
class_name = "ForkMeshRoom"

[[durable_objects.bindings]]
name = "FORKMESH_HOST"
class_name = "ForkMeshHost"

# Persistent storage: repo catalog, accounts, and the issue/pull inboxes.
# Create once with:  uvx --from workers-py pywrangler d1 create forkmesh
# then paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "forkmesh"
database_id = "2d33ad9e-1ab2-4ca0-9075-6105d0e04d11"
migrations_dir = "migrations"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ForkMeshRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ForkMeshCatalog"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ForkMeshFiles"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ForkMeshHost"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["ForkMeshAccounts"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["ForkMeshIssues"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["ForkMeshPulls"]

# Storage moved to D1: drop the Durable Objects that only held persistent data.
[[migrations]]
tag = "v8"
deleted_classes = [
    "ForkMeshCatalog",
    "ForkMeshFiles",
    "ForkMeshAccounts",
    "ForkMeshIssues",
    "ForkMeshPulls",
]


[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
