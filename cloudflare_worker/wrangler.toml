name = "forkmesh-relay"
main = "src/entry.py"
compatibility_flags = [ "python_workers", "disable_python_external_sdk" ]
compatibility_date = "2026-06-14"

# Runs automatically before every deploy: applies the D1 schema (idempotent).
[build]
command = "python3 tools/build_dashboard_assets.py && ./migrate.sh"


[triggers]
crons = ["* * * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "404-page"

run_worker_first = [
  "/api/*",
  "/.well-known/*",
  "/ap/*",
  "/nodeinfo/*",
  # The relay is the single production Worker for the World, marketing pages,
  # static assets, APIs, and realtime chat/presence.
  "/",
  "/health",
  "/simulate-sentry-error",
  "/admin-*",
  "/dashboard",
  "/dashboard/*",
  "!/dashboard/repos",
  "!/dashboard/network",
  "!/dashboard/chat",
  "!/dashboard/settings",
  "!/dashboard/profile",
  "!/dashboard/profile/repositories",
  "/index.html",
  "/blog.html",
  # The blog's RSS feed is built from blog.html at request time, so the
  # Worker must own it before the assets router treats rss.xml as a post
  # slug. /rss.xml is the root-level alias (and the _redirects safety net).
  "/blog/rss.xml",
  "/blog/feed.xml",
  "/rss.xml",
  "/feed.xml",
  "/login.html",
  "/signup.html",
  "/forgot-password.html",
  "/reset-password.html",
  "/mirror-payouts.html",
  "/referrals.html",
  "/outreach.html",
  "/security-report.html",
  "/docs.html",
  "/network.html",
  "/chat.html",
  "/desktop.html",
  "/about.html",
  "/features.html",
  "/pricing.html",
  "/press.html",
  "/careers.html",
  "/changelog.html",
  "/privacy.html",
  "/terms.html",
  "/status.html",
  "/@*",
  "/%40*",
  "/*/*",
  "!/dashboard/partials/*",
  "!/dashboard/js/*",
  # The precompiled dashboard utility stylesheet is requested by every
  # dashboard page. Keep it asset-first instead of letting the dashboard
  # application router turn it into a JSON 404.
  "!/dashboard/tailwind.css",
  "!/assets/*",
  "!/favicon/*",
  "!/blog/*",
  "!/docs/*",
  "!/world/*",
]

[vars]
NODE_NAME = "forkmesh-mainnode"
NODE_SOLANA_ADDRESS = ""
COMMUNITY_REWARD_NETWORK = "mainnet-beta"
COMMUNITY_REWARD_RPC_URL = "https://api.mainnet-beta.solana.com"
REWARD_INTERVAL_MS = "3600000"
REWARD_JITTER_MAX_MS = "2700000"
REWARD_AMOUNT_LAMPORTS = "100000"
REWARD_MIN_UPTIME_MS = "1800000"
REWARD_MIN_CONTRIBUTION_UNITS = "0"
REWARD_HEALTH_FRESH_MS = "600000"
# ForkBot's chat-to-issue model. llama-3.3-70b (fp8-fast) is markedly better
# at intent detection and supports Workers AI JSON mode (response_format
# json_schema), which _forkbot_run_ai requests first so replies are guaranteed
# parseable; the code default (FORKBOT_AI_DEFAULT_MODEL) stays llama-3.1-8b as
# a conservative fallback when this var is unset.
FORKBOT_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# Payout relay mesh (canonical routes /api/relay-mesh/*, legacy alias
# /api/federation/* — unrelated to the ActivityPub fediverse layer at /ap/*).
# Leave MAIN_RELAY_URL UNSET on the main relay (forkmesh.com). The relay
# coordinates public presence and unsigned reward intents; it does not custody
# signup deposits or load a wallet signing key.
#
# On a *federated* relay, set MAIN_RELAY_URL to the main relay's origin, e.g.
#   MAIN_RELAY_URL = "https://forkmesh.com"
# Then this relay's eligible nodes can join the main relay's public selection
# snapshot. Reward signing still happens only in the configured owner's local
# Qt client.
# A federated relay auto-generates its own Ed25519 federation identity (stored
# in D1, table relay_self) — no key to manage. Optionally set RELAY_LABEL and
# PUBLIC_BASE_URL so it identifies itself when registering. The main operator
# must then approve it:  UPDATE relays SET status='approved' WHERE label='<label>';
# (or via the signed admin API /api/accounts/admin-relay-approve). Until approved,
# its signups and reported nodes do nothing.
# MAIN_RELAY_URL = ""
# RELAY_LABEL = ""
# PUBLIC_BASE_URL = ""
# TREASURY_SOLANA_ADDRESS is the existing one-click deployment name for the
# public reward destination. COMMUNITY_REWARD_POOL_ADDRESS is an optional
# explicit modern override; REWARD_SIGNER_ACCOUNT identifies the local signer.
# The corresponding private key must exist only in the first instance owner's
# encrypted local Qt vault; never put it in wrangler variables, D1, Worker
# secrets, logs, or deployment manifests.
# Admins are set in the database, not here: the users table has an is_admin
# column. Grant one with: UPDATE users SET is_admin=1 WHERE username='<user>'.
# DATA_KEY encrypts D1 private row blobs and derives blind indexes. It is
# INTENTIONALLY NOT here: a value in [vars] is plaintext and committed. It
# lives in .env.production (gitignored) and is pushed as a Worker secret. It is
# not a wallet key and the Worker reward paths never use it to encrypt wallet
# seeds. Historical legacy-custody rows require the documented offline
# inventory/reconciliation/scrub migration.
# MIRROR_ROUTER_SIGNING_SEED is a separate Ed25519 infrastructure capability
# key in .env.production. It signs short-lived read requests sent to registered
# direct-HTTPS mirror gateways; it is never a user/wallet/repository key and is
# never written to D1. MIRROR_ROUTER_PUBLIC_KEY is deployed alongside it and is
# intentionally discoverable at GET /api/mirrors/https so gateway verifiers can
# be configured without receiving the signing seed.
# The secret admin dashboard path (ADMIN_PATH) is kept out of this committed
# file. It lives in .env.production (gitignored) and is pushed as a Worker
# *secret* by deploy.sh (`pywrangler secret put`) — NOT a plaintext var, which
# gets wiped on any deploy that doesn't re-declare it. Secrets persist across
# deploys. See .env.production.example. ADMIN_PATH must start with "admin-" so it
# is routed to the worker (see run_worker_first above); the dashboard is then
# served at https://<host>/<ADMIN_PATH>, gated by a forkmesh login whose account
# carries the is_admin flag (no static HTTP Basic credentials).

# Durable Objects are used only for transient state: encrypted chat/world
# presence plus the per-owner node event channel (payload-free "something
# changed" frames). Repository content and control traffic use normal HTTPS.
#
# ForkBot uses Cloudflare Workers AI when available to turn a chat mention into
# a crisp issue title/body. The Worker falls back to deterministic parsing when
# the binding is absent in local/dev contexts.
[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "FORKMESH_MAINNODE_ROOM"
class_name = "ForkMeshRoom"

[[durable_objects.bindings]]
name = "FORKMESH_WORLD"
class_name = "ForkMeshWorld"

[[durable_objects.bindings]]
name = "FORKMESH_OFFICE_ROOM"
class_name = "ForkMeshOfficeRoom"

[[durable_objects.bindings]]
name = "FORKMESH_NODES"
class_name = "ForkMeshNodes"

# Persistent storage: repo catalog, accounts, and the issue/pull inboxes.
# Create once with:  uvx --from workers-py pywrangler d1 create forkmesh
# then paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "forkmesh"
database_id = "2d33ad9e-1ab2-4ca0-9075-6105d0e04d11"
migrations_dir = "migrations"

# Separate D1 database for a "dev" environment (`pywrangler dev --env dev` /
# `pywrangler deploy --env dev`), kept apart from the production database above
# so dev work never reads or writes production data.
# Create once with:  uvx --from workers-py pywrangler d1 create forkmesh-dev
# then paste the printed database_id below.
[[env.dev.d1_databases]]
binding = "DB"
database_name = "forkmesh-dev"
database_id = "REPLACE_WITH_DEV_D1_DATABASE_ID"
migrations_dir = "migrations"

[env.dev.vars]
# Development is explicitly isolated on devnet. Production defaults above are
# mainnet-beta and must never silently fall back to this cluster.
COMMUNITY_REWARD_NETWORK = "devnet"
COMMUNITY_REWARD_RPC_URL = "https://api.devnet.solana.com"

[[env.dev.durable_objects.bindings]]
name = "FORKMESH_MAINNODE_ROOM"
class_name = "ForkMeshRoom"

[[env.dev.durable_objects.bindings]]
name = "FORKMESH_WORLD"
class_name = "ForkMeshWorld"

[[env.dev.durable_objects.bindings]]
name = "FORKMESH_OFFICE_ROOM"
class_name = "ForkMeshOfficeRoom"

[[env.dev.durable_objects.bindings]]
name = "FORKMESH_NODES"
class_name = "ForkMeshNodes"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ForkMeshRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ForkMeshCatalog"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ForkMeshFiles"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ForkMeshHost"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["ForkMeshAccounts"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["ForkMeshIssues"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["ForkMeshPulls"]

# Storage moved to D1: drop the Durable Objects that only held persistent data.
[[migrations]]
tag = "v8"
deleted_classes = [
    "ForkMeshCatalog",
    "ForkMeshFiles",
    "ForkMeshAccounts",
    "ForkMeshIssues",
    "ForkMeshPulls",
]

[[migrations]]
tag = "v9"
# ForkMeshWorld never uses its SQLite storage; registering it as a SQLite-backed
# class is still required by Cloudflare before the transient DO can be bound.
new_sqlite_classes = ["ForkMeshWorld"]

[[migrations]]
tag = "v10"
# Repository bytes and control traffic moved to the direct HTTPS mirror layer.
deleted_classes = ["ForkMeshHost"]

[[migrations]]
tag = "v11"
# Office meeting rooms keep only live WebSocket state, but Cloudflare requires
# every bound Durable Object class to be registered through a migration.
new_sqlite_classes = ["ForkMeshOfficeRoom"]

[[migrations]]
tag = "v12"
# Per-owner node event channel (unlike the retired per-repo ForkMeshHost
# tunnel, it never carries repository bytes — see ForkMeshNodes in entry.py).
# Live sockets are runtime state; SQLite registration is still required.
new_sqlite_classes = ["ForkMeshNodes"]


[observability]
enabled = true
head_sampling_rate = 1

# Logs stay in the Cloudflare dashboard only. The Sentry destinations added in
# the 2026-07-18 full-sampling round exported an info event for every D1 call,
# Durable Object websocket wakeup, and request ("d1_run OK",
# "hibernatableWebSocket OK", "POST OK", ...), flooding Sentry. Real error
# reporting is unaffected: it goes through capture_sentry_error in src/entry.py.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false

[observability.traces]
enabled = false
