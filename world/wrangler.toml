name = "forkmesh-world"
main = "worker.js"
compatibility_date = "2026-08-03"

[build]
command = "python3 ../app/tools/build_site_assets.py world"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "404-page"
run_worker_first = true

[vars]
APP_ORIGIN = "https://app.forkmesh.com"
WWW_ORIGIN = "https://www.forkmesh.com"

[[routes]]
pattern = "world.forkmesh.com"
custom_domain = true

[observability]
enabled = true
head_sampling_rate = 0.05

[observability.logs]
enabled = true
head_sampling_rate = 0.05
invocation_logs = false
