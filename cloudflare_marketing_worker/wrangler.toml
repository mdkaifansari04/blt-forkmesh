name = "forkmesh-marketing"
main = "src/entry.js"
compatibility_date = "2026-06-14"

# This Worker owns EXACTLY forkmesh.com/ — the marketing landing page — and
# nothing else. Cloudflare route patterns are ranked by specificity and routes
# take precedence over a Worker Custom Domain, so this exact-match pattern
# intercepts only the root URL while every other path (/api/*, /dashboard,
# /login, /owner/repo, /styles.css, ...) keeps hitting the relay Worker
# (../cloudflare_worker, name "forkmesh-relay") exactly as before. That is the
# whole split: forkmesh.com/ is this Worker, forkmesh.com/anything is the relay.
#
# The landing page's subresources (/styles.css, /assets/*, /site-header.js,
# /favicon/*, ...) are therefore still served by the relay Worker's static
# assets — this Worker only ever serves the root HTML document.
routes = [
  { pattern = "forkmesh.com/", zone_name = "forkmesh.com" },
]

# The landing document stays canonical in ../cloudflare_worker/public/index.html
# (next to the shared CSS/JS it references, and so the relay's homepage fallback
# keeps working on workers.dev previews and in local dev). This build step copies
# it in before every deploy — public/ here is generated, never edited.
[build]
command = "mkdir -p public && cp ../cloudflare_worker/public/index.html public/index.html"

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
# The Worker must see every request before the asset store does: / varies on
# the forkmesh_session cookie (302 to /dashboard vs the landing page), which a
# directly-served static asset could never do.
run_worker_first = true

[observability]
enabled = true
head_sampling_rate = 1
