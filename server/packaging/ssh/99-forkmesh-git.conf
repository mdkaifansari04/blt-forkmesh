# This drop-in intentionally changes only the dedicated ForkMesh Git account.
# Root and other administrative authentication paths remain unchanged.
Match User git
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile none
    AuthorizedKeysCommand /opt/forkmesh-mirror/ssh-gateway-entrypoint authorized-key --key-type %t --key-blob %k
    AuthorizedKeysCommandUser forkmesh-ssh-lookup
    TrustedUserCAKeys none
    PermitTTY no
    DisableForwarding yes
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no
    PermitUserRC no
    MaxSessions 1

Match all
