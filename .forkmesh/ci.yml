name: CI tests
on: [push]
jobs:
  test:
    steps:
      # Each suite gets its own Actions scope. Keeping the compiler and pytest
      # in one scope starves the test runner and leaves its shell vulnerable to
      # a process-group SIGTERM before either suite can report a useful result.
      - name: Critical Cloudflare Worker contracts
        run: |
          set -eu
          ci_tmp="$PWD/.forkmesh-ci-tmp"
          export TMPDIR="$ci_tmp"
          rm -rf "$ci_tmp"
          mkdir -p "$ci_tmp"

          # Actions run with egress disabled, so CI imports the packages
          # provided by the node instead of trying to install them.
          python3 - <<'PY'
          import importlib.util
          import sys
          missing = [
              name for name in ("pytest", "cryptography")
              if importlib.util.find_spec(name) is None
          ]
          if missing:
              print(
                  "Runner image is missing required offline Python packages: "
                  + ", ".join(missing),
                  file=sys.stderr,
              )
              print(
                  "Install them for the node's own python3, system-wide or "
                  "per-user on the host; network access is intentionally "
                  "disabled during Actions.",
                  file=sys.stderr,
              )
              raise SystemExit(2)
          PY
          python3 tools/run_critical_tests.py worker

      - name: Critical virtual World contracts
        run: |
          set -eu
          python3 tools/run_critical_tests.py world

      - name: Worker syntax + config
        run: |
          set -eu
          python3 -c "import ast; ast.parse(open('app/src/entry.py').read()); print('entry.py OK')"
          python3 -c "import tomllib; [tomllib.load(open(f'{unit}/wrangler.toml','rb')) for unit in ('app','world')]; print('Worker manifests OK')"

      - name: Critical Qt client contracts
        run: |
          set -eu
          ci_tmp="$PWD/.forkmesh-ci-tmp"
          export TMPDIR="$ci_tmp"
          export CCACHE_DIR="$ci_tmp/ccache"
          rm -rf "$ci_tmp"
          mkdir -p "$CCACHE_DIR"

          # Size -j from the sandbox's memory budget as well as its CPU quota.
          # The heaviest translation units here (MainWindow*.cpp) peak near
          # 1.5 GiB each in a Release build, so on a many-core node the CPU
          # quota alone asks for more parallel compiles than the cgroup can
          # hold — which is an OOM kill mid-build, not a slow build.
          cpus="${FORKMESH_ACTIONS_CPUS:-2}"
          memory_mb="${FORKMESH_ACTIONS_MEMORY_MB:-4096}"
          jobs=$(( memory_mb / 1536 ))
          if [ "$jobs" -lt 1 ]; then jobs=1; fi
          if [ "$jobs" -gt "$cpus" ]; then jobs="$cpus"; fi
          echo "building with -j$jobs (${cpus} cpus, ${memory_mb} MiB budget)"

          # AUTOGEN_PARALLEL defaults to AUTO, and AUTO means the *host's* core
          # count: nothing in the sandbox can see the cgroup. Every AUTOMOC
          # driver make starts then opens a host-sized thread pool, so a -j8
          # build asked for eight of them at once and pthread_create failed
          # against TasksMax with "Resource temporarily unavailable" (#1586).
          # Pin the pools to the same budget the compiles are sized from.
          cmake -S desktop -B desktop/build-ci -DCMAKE_BUILD_TYPE=Release -DFORKMESH_BUILD_TESTS=ON -DCMAKE_AUTOGEN_PARALLEL="$jobs"

          # `critical-tests` is defined next to the "critical" CTest label, so
          # it always covers exactly the binaries the runner is about to
          # execute. Naming the suites here instead let the two lists drift,
          # and an unbuilt suite only surfaces as a ctest "***Not Run".
          cmake --build desktop/build-ci -j "$jobs" --target critical-tests
          python3 tools/run_critical_tests.py qt --build-dir desktop/build-ci
