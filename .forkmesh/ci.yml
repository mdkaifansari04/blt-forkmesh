name: CI tests
on: [push]
jobs:
  test:
    steps:
      # Each suite gets its own Actions scope. Keeping the compiler and pytest
      # in one scope starves the test runner and leaves its shell vulnerable to
      # a process-group SIGTERM before either suite can report a useful result.
      - name: Cloudflare Worker test suite
        run: |
          set -eu
          ci_tmp="$PWD/.forkmesh-ci-tmp"
          export TMPDIR="$ci_tmp"
          rm -rf "$ci_tmp"
          mkdir -p "$ci_tmp"

          # Actions run with egress disabled, so CI imports the packages
          # provided by the node instead of trying to install them.
          python3 - <<'PY'
          import importlib.util
          import sys
          missing = [
              name for name in ("pytest", "cryptography")
              if importlib.util.find_spec(name) is None
          ]
          if missing:
              print(
                  "Runner image is missing required offline Python packages: "
                  + ", ".join(missing),
                  file=sys.stderr,
              )
              print(
                  "Install them for the node's own python3, system-wide or "
                  "per-user on the host; network access is intentionally "
                  "disabled during Actions.",
                  file=sys.stderr,
              )
              raise SystemExit(2)
          PY
          # Main currently carries a bounded, explicit set of historical red
          # tests. CI still executes them as xfails, while any failure outside
          # that reviewed list remains fatal.
          FORKMESH_CI_KNOWN_FAILURES=1 \
            python3 -m pytest -q cloudflare_worker/tests

      - name: Worker syntax + config
        run: |
          set -eu
          python3 -c "import ast; ast.parse(open('cloudflare_worker/src/entry.py').read()); print('entry.py OK')"
          python3 -c "import tomllib; tomllib.load(open('cloudflare_worker/wrangler.toml','rb')); print('wrangler.toml OK')"

      - name: Qt client tests
        run: |
          set -eu
          ci_tmp="$PWD/.forkmesh-ci-tmp"
          export TMPDIR="$ci_tmp"
          export CCACHE_DIR="$ci_tmp/ccache"
          rm -rf "$ci_tmp"
          mkdir -p "$CCACHE_DIR"
          cmake -S qt_client -B qt_client/build-ci -DCMAKE_BUILD_TYPE=Release -DFORKMESH_BUILD_TESTS=ON
          cmake --build qt_client/build-ci -j "${FORKMESH_ACTIONS_CPUS:-2}" --target forkmesh-tests
          ./qt_client/build-ci/forkmesh-tests
