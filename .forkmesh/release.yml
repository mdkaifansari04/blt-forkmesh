name: Attach desktop build to release
# Automatically builds the desktop Qt client for each platform when a release is
# published (a tag drafted from the Releases panel). Each node it runs on builds
# its own platform's binary and publishes it to the release, so to cover
# Linux + macOS + Windows, the workflow runs on a node of each OS. The installer
# (cloudflare_worker/public/install.sh) then autodetects the visitor's platform
# and downloads the matching prebuilt binary instead of compiling.
#
# Release binaries are NOT committed into git (issue #304). The binary bytes are
# staged into the node's content-addressed release store (the CAS, co-located
# with the served mirror) and only small TEXT metadata is committed under
# .forkmesh/releases/<channel>/ — SHASUMS256.txt + release.json. install.sh reads that
# metadata over the git proxy, authenticates the detached Ed25519 signature
# against a separately provisioned publisher key, then downloads the binary
# from the relay's content-addressed endpoint and verifies its SHA-256.
#
# Triggered by the release event (the runner checks out the tagged commit and
# exports FORKMESH_TAG with the tag name); also runnable by hand via
# workflow_dispatch.
on: [release, workflow_dispatch]
jobs:
  release:
    steps:
      # Build the optimized desktop client, name the binary forkmesh-<os>-<arch>
      # [.exe] (the exact scheme install.sh resolves from `uname`), then publish
      # it: tools/forkmesh-release-publish.sh hashes the binary, copies the bytes
      # into the node's CAS, and writes .forkmesh/releases/<channel>/{SHASUMS256.txt,
      # release.json}. The runner sets FORKMESH_RELEASE_CAS to the served CAS
      # (<mirror>/forkmesh-releases) so the bytes land where the node streams them
      # from, then — after this step succeeds — harvests the .forkmesh/releases/<channel>/
      # signed metadata into the working copy, commits it, and publishes (syncs the
      # served mirror). The asset goes live for download automatically; nothing
      # here needs to commit into the throwaway worktree (cleanup discards it).
      - name: Build and attach the desktop binary
        run: |
          set -e

          # Where install.sh looks for prebuilt assets. Override RELEASE_CHANNEL
          # to cut a named/pre-release channel instead of overwriting "latest".
          channel="${RELEASE_CHANNEL:-latest}"

          # Provenance is meaningful only for committed inputs. Ignore the
          # release metadata directory (it is output of this job), but reject
          # every tracked or untracked source change before building bytes.
          dirty="$(git status --porcelain=v1 --untracked-files=all -- . \
            ':(exclude).forkmesh/releases/**')"
          if [ -n "$dirty" ]; then
            echo "ERROR: release artifact build requires a clean source worktree." >&2
            exit 1
          fi

          # Map this host's uname to the asset name install.sh autodetects.
          os="$(uname -s)"
          arch="$(uname -m)"
          case "$os" in
            Linux)                            os="linux" ;;
            Darwin)                           os="macos" ;;
            MINGW*|MSYS*|CYGWIN*|Windows_NT)  os="windows" ;;
            *) os="$(printf '%s' "$os" | tr '[:upper:]' '[:lower:]')" ;;
          esac
          case "$arch" in
            x86_64|amd64|x64) arch="x86_64" ;;
            aarch64|arm64)    arch="arm64" ;;
          esac
          asset="forkmesh-${os}-${arch}"
          [ "$os" = "windows" ] && asset="${asset}.exe"
          echo "Building release asset: $asset (channel: $channel)"

          # The release tag and committed project version must already agree.
          # Mutating CMakeLists.txt during/after this job would create a source
          # revision for which no just-built artifact exists, defeating exact
          # fleet provenance. Version bumps therefore land before the tag.
          project_version="$(
            sed -nE \
              's/^project\(ForkMesh VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' \
              qt_client/CMakeLists.txt | head -n1
          )"
          # A manual workflow resolves the immutable tag for the committed
          # project version instead of letting the publisher guess a possibly
          # older nearest tag. Same-version rebuilds may have a newer
          # build_commit while this tag target remains immutable.
          release_tag="${FORKMESH_TAG:-v${project_version}}"
          version="${release_tag#v}"
          version_base="${version%%-*}"
          version_base="${version_base%%+*}"
          if [ -z "$project_version" ] ||
             [ "$version_base" != "$project_version" ]; then
            echo "ERROR: release version '$version' does not match committed project version '$project_version'." >&2
            echo "       Commit the version bump before creating the release tag." >&2
            exit 1
          fi
          if ! git rev-parse --verify \
               "refs/tags/${release_tag}^{commit}" >/dev/null 2>&1; then
            echo "ERROR: release tag '$release_tag' does not exist or does not target a commit." >&2
            exit 1
          fi

          # Stamp the exact checkout commit separately: the fleet installer
          # compares this embedded revision with release.json/build_commit, so a
          # stale artifact cannot pass merely because it has the same semver.
          # release.json is committed after this artifact is built.  Use the
          # newest non-release-metadata commit as the code provenance on both
          # sides, avoiding an impossible artifact<->metadata commit cycle.
          revision="$(git log -1 --format=%H -- . \
            ':(exclude).forkmesh/releases/**')"

          # Configure + build the client (Release, tests off — this is a release
          # artifact build, the CI workflow already runs the test suite).
          # Size -j to the sandbox budget, not the host: inside the Actions
          # cgroup `nproc` overcounts the CPU quota (compilers thrash and the
          # build runs into the step deadline) and one g++ per host core can
          # blow MemoryMax. The runner publishes the real budget; outside it
          # (plain checkout, macOS/Windows nodes) fall back to the host.
          jobs="${FORKMESH_ACTIONS_CPUS:-}"
          if [ -z "$jobs" ]; then
            jobs="$( (nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4) )"
          fi
          mem_mb="${FORKMESH_ACTIONS_MEMORY_MB:-0}"
          if [ "$mem_mb" -gt 0 ]; then
            mem_jobs=$((mem_mb / 1024))  # ~1 GiB per C++ translation unit
            [ "$mem_jobs" -lt 1 ] && mem_jobs=1
            [ "$jobs" -gt "$mem_jobs" ] && jobs="$mem_jobs"
          fi
          [ "$jobs" -lt 1 ] && jobs=1
          echo "Building with -j$jobs (memory budget: ${mem_mb}MB)"
          cmake -S qt_client -B qt_client/build-release \
            -DCMAKE_BUILD_TYPE=Release -DFORKMESH_BUILD_TESTS=OFF \
            -DFORKMESH_BUILD_COMMIT_OVERRIDE="$revision" \
            ${version:+-DFORKMESH_VERSION_OVERRIDE="$version"}
          cmake --build qt_client/build-release -j"$jobs"
          install_root="qt_client/build-release/install"
          cmake --install qt_client/build-release --prefix "$install_root"

          # Locate the executable inside the CMake install tree. That tree also
          # contains the pinned bootstrap/Tunnel/gateway tools plus the Worker
          # source, generated/static assets, and migrations required by the
          # token-only Cloudflare flow; native packagers must ship it intact.
          built=""
          for cand in \
            "$install_root/bin/forkmesh" \
            "$install_root/bin/forkmesh.exe" \
            "$install_root/ForkMesh.app/Contents/MacOS/ForkMesh"; do
            if [ -x "$cand" ]; then built="$cand"; break; fi
          done
          if [ -z "$built" ]; then
            echo "ERROR: build did not produce an executable in qt_client/build-release" >&2
            exit 1
          fi
          reported_version="$("$built" --version 2>&1)" || {
            echo "ERROR: built release did not report its version." >&2
            exit 1
          }
          if [ "$reported_version" != "ForkMesh $version" ]; then
            echo "ERROR: built release reports '$reported_version' (expected 'ForkMesh $version')." >&2
            exit 1
          fi
          reported_commit="$("$built" --build-commit 2>&1)" || {
            echo "ERROR: built release did not report an exact source commit." >&2
            exit 1
          }
          if [ "$reported_commit" != "$revision" ]; then
            echo "ERROR: built release reports source commit '$reported_commit' (expected '$revision')." >&2
            exit 1
          fi

          # Name the built binary the way install.sh resolves per platform, then
          # publish it via the content-addressed store (no binary in git). The
          # CAS dir must be the one the serving node reads from:
          # <mirror>/forkmesh-releases. Set FORKMESH_RELEASE_CAS to that path on
          # the node; it defaults to .forkmesh/release-blobs otherwise.
          staged="$asset"
          cp "$built" "$staged"
          chmod 0755 "$staged" || true

          # Wrap the bare binary into this platform's native, (optionally) signed
          # installer for desktop users (issue #370): AppImage on Linux, an NSIS
          # setup.exe on Windows, a notarized .dmg on macOS. Signing is driven by
          # CI-secret env vars; a packager with no cert/toolchain emits an
          # UNSIGNED artifact and warns rather than failing the release, and the
          # bare binary is always published too (headless/SSH installs use it).
          # See docs/design/signed-installers.md.
          publish_assets=("$staged")
          package_input="$built"
          if [ "$os" = "macos" ]; then
            package_input="$install_root/ForkMesh.app"
          fi
          installer="$(tools/package/package-release.sh \
            --os "$os" --arch "$arch" \
            --binary "$package_input" \
            --install-root "$install_root" \
            --channel "$channel" \
            --tag "$release_tag" \
            --outdir . | tail -n1 || true)"
          if [ -n "$installer" ] && [ -f "$installer" ]; then
            echo "Built installer: $installer"
            publish_assets+=("$installer")
            # zsync delta control file rides along when the AppImage produced one.
            [ -f "${installer}.zsync" ] && publish_assets+=("${installer}.zsync")
          else
            echo "No installer produced for $os; publishing the bare binary only."
          fi

          cas="${FORKMESH_RELEASE_CAS:-.forkmesh/release-blobs}"
          if [ -z "${FORKMESH_RELEASE_SIGNING_KEY:-}" ] ||
             [ ! -f "$FORKMESH_RELEASE_SIGNING_KEY" ]; then
            echo "ERROR: FORKMESH_RELEASE_SIGNING_KEY must point to the local Ed25519 release private key." >&2
            exit 1
          fi
          tools/forkmesh-release-publish.sh \
            --channel "$channel" \
            --tag "$release_tag" \
            --build-commit "$revision" \
            --cas-dir "$cas" \
            ${FORKMESH_REPO:+--repo "$FORKMESH_REPO"} \
            "${publish_assets[@]}"

          # Regenerate the Sparkle/WinSparkle appcast from the freshly-written
          # release.json so in-app update checks (macOS/Windows) see the new
          # release. Derived from the same manifest the bare-binary path uses, so
          # there is a single source of truth for "latest" (docs §2). Committed
          # alongside the other .forkmesh/releases/<channel>/ metadata.
          RELEASE_CHANNEL="$channel" tools/package/generate-appcast.sh \
            --channel "$channel" || echo "appcast generation skipped"

          # The bytes are now in the served CAS and the small text metadata
          # (SHASUMS256.txt + release.json + release.json.sig + appcast.xml) is written under
          # .forkmesh/releases/${channel}/. ForkMesh harvests that metadata into the working
          # copy, commits it, and publishes the mirror once this step succeeds — so
          # the asset becomes downloadable with no manual commit. (Running this
          # script standalone, outside ForkMesh? Commit .forkmesh/releases/${channel}/ and
          # publish it yourself.)
          echo "Staged asset: $asset (channel: $channel)"
          echo "Once published, install it with:"
          echo "  curl -fsSL \"\${FORKMESH_HOST:-https://forkmesh.com}/install.sh\" | bash"
