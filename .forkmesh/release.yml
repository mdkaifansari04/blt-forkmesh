name: Attach desktop build to release
# Automatically builds the desktop Qt client for each platform when a release is
# published (a tag drafted from the Releases panel). Each node it runs on builds
# its own platform's binary and publishes it to the release, so to cover
# Linux + macOS + Windows, the workflow runs on a node of each OS. The installer
# (cloudflare_worker/public/install.sh) then autodetects the visitor's platform
# and downloads the matching prebuilt binary instead of compiling.
#
# Release binaries are NOT committed into git (issue #304). The binary bytes are
# staged into the node's content-addressed release store (the CAS, co-located
# with the served mirror) and only small TEXT metadata is committed under
# releases/<channel>/ — SHASUMS256.txt + release.json. install.sh reads that
# metadata over the git proxy, then downloads the binary from the relay's
# content-addressed endpoint and verifies its sha256.
#
# Triggered by the release event (the runner checks out the tagged commit and
# exports FORKMESH_TAG with the tag name); also runnable by hand via
# workflow_dispatch.
on: [release, workflow_dispatch]
jobs:
  release:
    steps:
      # Build the optimized desktop client, name the binary forkmesh-<os>-<arch>
      # [.exe] (the exact scheme install.sh resolves from `uname`), then publish
      # it: tools/forkmesh-release-publish.sh hashes the binary, copies the bytes
      # into the node's CAS, and writes releases/<channel>/{SHASUMS256.txt,
      # release.json}. The runner sets FORKMESH_RELEASE_CAS to the served CAS
      # (<mirror>/forkmesh-releases) so the bytes land where the node streams them
      # from, then — after this step succeeds — harvests the releases/<channel>/
      # metadata into the working copy, commits it, and publishes (syncs the
      # served mirror). The asset goes live for download automatically; nothing
      # here needs to commit into the throwaway worktree (cleanup discards it).
      - name: Build and attach the desktop binary
        run: |
          set -e

          # Where install.sh looks for prebuilt assets. Override RELEASE_CHANNEL
          # to cut a named/pre-release channel instead of overwriting "latest".
          channel="${RELEASE_CHANNEL:-latest}"

          # Map this host's uname to the asset name install.sh autodetects.
          os="$(uname -s)"
          arch="$(uname -m)"
          case "$os" in
            Linux)                            os="linux" ;;
            Darwin)                           os="macos" ;;
            MINGW*|MSYS*|CYGWIN*|Windows_NT)  os="windows" ;;
            *) os="$(printf '%s' "$os" | tr '[:upper:]' '[:lower:]')" ;;
          esac
          case "$arch" in
            x86_64|amd64|x64) arch="x86_64" ;;
            aarch64|arm64)    arch="arm64" ;;
          esac
          asset="forkmesh-${os}-${arch}"
          [ "$os" = "windows" ] && asset="${asset}.exe"
          echo "Building release asset: $asset (channel: $channel)"

          # Configure + build the client (Release, tests off — this is a release
          # artifact build, the CI workflow already runs the test suite).
          jobs="$( (nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4) )"
          cmake -S qt_client -B qt_client/build-release \
            -DCMAKE_BUILD_TYPE=Release -DFORKMESH_BUILD_TESTS=OFF
          cmake --build qt_client/build-release -j"$jobs"

          # Locate the produced executable (a bare binary on Linux/Windows, a
          # .app bundle on macOS).
          built=""
          for cand in \
            "qt_client/build-release/forkmesh" \
            "qt_client/build-release/forkmesh.exe" \
            "qt_client/build-release/ForkMesh.app/Contents/MacOS/ForkMesh"; do
            if [ -x "$cand" ]; then built="$cand"; break; fi
          done
          if [ -z "$built" ]; then
            echo "ERROR: build did not produce an executable in qt_client/build-release" >&2
            exit 1
          fi

          # Name the built binary the way install.sh resolves per platform, then
          # publish it via the content-addressed store (no binary in git). The
          # CAS dir must be the one the serving node reads from:
          # <mirror>/forkmesh-releases. Set FORKMESH_RELEASE_CAS to that path on
          # the node; it defaults to .forkmesh/release-blobs otherwise.
          staged="$asset"
          cp "$built" "$staged"
          chmod 0755 "$staged" || true

          cas="${FORKMESH_RELEASE_CAS:-.forkmesh/release-blobs}"
          tools/forkmesh-release-publish.sh \
            --channel "$channel" \
            --tag "${FORKMESH_TAG:-}" \
            --cas-dir "$cas" \
            ${FORKMESH_REPO:+--repo "$FORKMESH_REPO"} \
            "$staged"

          # The bytes are now in the served CAS and the small text metadata
          # (SHASUMS256.txt + release.json) is written under releases/${channel}/.
          # ForkMesh harvests that metadata into the working copy, commits it, and
          # publishes the mirror once this step succeeds — so the asset becomes
          # downloadable with no manual commit. (Running this script standalone,
          # outside ForkMesh? Commit releases/${channel}/ and publish it yourself.)
          echo "Staged asset: $asset (channel: $channel)"
          echo "Once published, install it with:"
          echo "  curl -fsSL \"\${FORKMESH_HOST:-https://forkmesh.com}/install.sh\" | bash"
