name: Build Android app
on: [push, workflow_dispatch]
jobs:
  android:
    steps:
      # Only build when this push actually touched flutter_app/. Mirrors the
      # deploy workflow's "skip unless changed" gate: a sentinel file written
      # here is checked by the build step so it no-ops on unrelated commits.
      - name: Skip unless flutter_app/ changed
        run: |
          # HEAD is normally a MERGE commit (agent branches land on main via
          # merge), and a plain `git diff-tree HEAD` emits NOTHING for a merge
          # (combined-diff default), so every merge-to-main skipped this build.
          # Diff against the first parent (old main tip) so a merge that brings
          # in flutter_app/ changes is detected; fall back to the empty tree for
          # a root commit. Mirrors the deploy workflow's fix for issue #267.
          if parent="$(git rev-parse --verify --quiet HEAD^1)"; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$parent" HEAD)"
          else
            changed_files="$(git diff-tree --no-commit-id --name-only -r --root HEAD)"
          fi
          app_changes="$(printf '%s\n' "$changed_files" | sed -n '/^flutter_app\//p')"
          if [ -z "$app_changes" ]; then
            echo "Skipping Android build; no flutter_app/ changes in this commit."
            touch .forkmesh-skip-android
          else
            echo "flutter_app/ changes detected:"
            printf '%s\n' "$app_changes"
          fi

      # Build the release APK and copy it into $HOME/forkmesh-artifacts, which
      # the runner lands in this node's Actions artifacts store once the run
      # finishes — everything else in the sandbox (workspace, $HOME, /tmp) is
      # deleted with it. The landed path is printed to the run log; ForkMesh has
      # no relay artifact upload.
      - name: Build APK and collect artifact
        run: |
          [ -f .forkmesh-skip-android ] && exit 0
          set -e

          # Self-install Flutter + the Android SDK + a JDK under
          # $HOME/.forkmesh/toolchain when this node doesn't already have them,
          # the same way cloudflare_worker/pywrangler.sh self-installs the
          # deploy toolchain instead of assuming the host has it
          # pre-provisioned.
          . tools/flutter-android-toolchain.sh

          # Actions run with the network namespace unshared unless the node sets
          # the FORKMESH_ACTIONS_ALLOW_NETWORK variable, and an Android build
          # needs egress twice over: to install the toolchain at all (the
          # sandbox $HOME starts empty every run, so nothing is cached between
          # them), and then for `flutter pub get` and Gradle's own dependency
          # and NDK downloads. Report that as a skip instead of a red run — the
          # old code just let `apt-get download` fail under `set -e`, so every
          # push touching flutter_app/ died as a bare "exit code 100".
          if [ "$FLUTTER_TOOLCHAIN_STATUS" = "offline" ]; then
            echo "Skipping the Android build: $FLUTTER_TOOLCHAIN_REASON."
            echo "To build APKs here, allow network access for Actions on this"
            echo "node (set the FORKMESH_ACTIONS_ALLOW_NETWORK variable under"
            echo "Settings -> Secrets & Coves), or run this workflow on a node"
            echo "that already has one."
            exit 0
          fi
          # A toolchain that could not be installed on a node that DOES have
          # egress is a real breakage, not a policy skip: fail the run.
          if [ "$FLUTTER_TOOLCHAIN_READY" != "1" ]; then
            echo "ERROR: Android toolchain unavailable: $FLUTTER_TOOLCHAIN_REASON." >&2
            exit 1
          fi
          "$FLUTTER" --version

          cd flutter_app
          "$FLUTTER" pub get
          "$FLUTTER" build apk --release

          apk="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "ERROR: APK was not produced at $apk" >&2
            exit 1
          fi

          commit="$(git rev-parse --short HEAD)"
          dest="$HOME/forkmesh-artifacts/android/$commit"
          mkdir -p "$dest"
          out="$dest/forkmesh-$commit.apk"
          cp "$apk" "$out"
          echo "Artifact: $out ($(du -h "$out" | cut -f1))"
