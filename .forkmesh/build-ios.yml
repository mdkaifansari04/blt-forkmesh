name: Build iOS app (macOS)
on: [push, workflow_dispatch]
jobs:
  ios:
    steps:
      # Only build when this push actually touched flutter_app/. Mirrors the
      # Android/deploy workflows' "skip unless changed" gate: a sentinel file
      # written here is checked by the build step so it no-ops on unrelated
      # commits.
      - name: Skip unless flutter_app/ changed
        run: |
          # HEAD is normally a MERGE commit (agent branches land on main via
          # merge), and a plain `git diff-tree HEAD` emits NOTHING for a merge
          # (combined-diff default), so every merge-to-main would skip this
          # build. Diff against the first parent (old main tip) so a merge that
          # brings in flutter_app/ changes is detected; fall back to the empty
          # tree for a root commit. Mirrors the deploy workflow's issue #267 fix.
          if parent="$(git rev-parse --verify --quiet HEAD^1)"; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$parent" HEAD)"
          else
            changed_files="$(git diff-tree --no-commit-id --name-only -r --root HEAD)"
          fi
          app_changes="$(printf '%s\n' "$changed_files" | sed -n '/^flutter_app\//p')"
          if [ -z "$app_changes" ]; then
            echo "Skipping iOS build; no flutter_app/ changes in this commit."
            touch .forkmesh-skip-ios
          else
            echo "flutter_app/ changes detected:"
            printf '%s\n' "$app_changes"
          fi

      # Build the unsigned release .app and copy it out of the (temporary) run
      # worktree to a persistent artifacts dir on this node, since the worktree
      # is removed when the run finishes. The artifact path is printed to the
      # run log — that's the attached artifact link (ForkMesh has no relay
      # artifact upload). iOS binaries can only be compiled on macOS, so this
      # step only succeeds on a Mac node.
      - name: Build .app and collect artifact
        run: |
          [ -f .forkmesh-skip-ios ] && exit 0
          set -e

          # This build requires macOS (Xcode toolchain). Fail clearly elsewhere.
          if [ "$(uname -s)" != "Darwin" ]; then
            echo "ERROR: iOS builds require a macOS node (this host is $(uname -s))." >&2
            exit 1
          fi

          # Locate Flutter (CI PATH may not include it).
          if ! command -v flutter >/dev/null 2>&1; then
            for d in "$HOME/flutter/bin" "$HOME/development/flutter/bin" \
                     /opt/homebrew/bin /usr/local/bin /opt/flutter/bin; do
              if [ -x "$d/flutter" ]; then PATH="$d:$PATH"; break; fi
            done
          fi
          if ! command -v flutter >/dev/null 2>&1; then
            echo "ERROR: flutter not found on this CI host." >&2
            echo "Install Flutter + Xcode to build the iOS app." >&2
            exit 1
          fi
          flutter --version

          cd flutter_app
          flutter pub get
          flutter build ios --release --no-codesign

          app="build/ios/iphoneos/Runner.app"
          if [ ! -d "$app" ]; then
            echo "ERROR: .app bundle was not produced at $app" >&2
            exit 1
          fi

          commit="$(git rev-parse --short HEAD)"
          dest="$HOME/forkmesh-artifacts/ios/$commit"
          mkdir -p "$dest"
          out="$dest/forkmesh-$commit.app.zip"
          # Zip the .app bundle into a single downloadable artifact file.
          (cd build/ios/iphoneos && zip -qry "$out" Runner.app)
          echo "Artifact: $out ($(du -h "$out" | cut -f1))"
