name: Deploy Cloudflare Worker
on: [push]
# CI/CD gate: the Worker test suite "CI tests" already ran for this commit, so
# wait for that run instead of repeating it here. The deploy starts only after
# it succeeds; if it fails (or is rejected) this run is skipped and nothing
# reaches Cloudflare. A commit where that workflow never ran on this node
# (dedicated elsewhere, disabled, or absent) is not gated — there is no result
# to wait for.
needs: [.forkmesh/ci.yml]
jobs:
  deploy:
    steps:
      - name: Skip unless worker files changed
        run: |
          if parent="$(git rev-parse --verify --quiet HEAD^1)"; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$parent" HEAD)"
          else
            changed_files="$(git diff-tree --no-commit-id --name-only -r --root HEAD)"
          fi
          worker_changes="$(printf '%s\n' "$changed_files" | sed -n -E '/^(app|www|world)\//p')"
          if [ -z "$worker_changes" ]; then
            echo "Skipping deploy; no App, World, or www changes in this commit."
            touch .forkmesh-skip-deploy
          else
            echo "Deploying changed Worker inputs:"
            printf '%s\n' "$worker_changes"
          fi
      # .env.production is gitignored, so materialize it from this node's ForkMesh
      # Variables/Secrets (Settings -> Secrets & Coves). ForkMesh fills in the
      # ${{ vars.NAME }} references below from that store before running the step;
      # GitHub-Actions ${{ secrets.NAME }} and step-level `env:` are NOT understood
      # here, so reference vars.* instead. deploy.sh then reads .env.production,
      # exports CLOUDFLARE_* for wrangler, and pushes the Worker secrets. The
      # quoted 'EOF' writes the substituted values verbatim (no shell re-expansion),
      # so a token/password containing $ or backticks survives intact.
      - name: Write production env
        run: |
          [ -f .forkmesh-skip-deploy ] && exit 0
          cat > app/.env.production <<'EOF'
          CLOUDFLARE_ACCOUNT_ID=${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN=${{ vars.CLOUDFLARE_API_TOKEN }}
          ADMIN_PATH=${{ vars.ADMIN_PATH }}
          ADMIN_PASS=${{ vars.ADMIN_PASS }}
          TREASURY_SOLANA_ADDRESS=${{ vars.TREASURY_SOLANA_ADDRESS }}
          MIRROR_ROUTER_PUBLIC_KEY=${{ vars.MIRROR_ROUTER_PUBLIC_KEY }}
          MIRROR_ROUTER_SIGNING_SEED=${{ vars.MIRROR_ROUTER_SIGNING_SEED }}
          SSH_GATEWAY_HOST=${{ vars.SSH_GATEWAY_HOST }}
          SSH_GATEWAY_PORT=${{ vars.SSH_GATEWAY_PORT }}
          SSH_GATEWAY_TOKEN=${{ vars.SSH_GATEWAY_TOKEN }}
          SSH_GATEWAY_REPOSITORIES=${{ vars.SSH_GATEWAY_REPOSITORIES }}
          SSH_GATEWAY_NODE_HOSTS=${{ vars.SSH_GATEWAY_NODE_HOSTS }}
          MAILTRAP_API_TOKEN=${{ vars.MAILTRAP_API_TOKEN }}
          MAILTRAP_WEBHOOK_SECRET=${{ vars.MAILTRAP_WEBHOOK_SECRET }}
          DATA_KEY=${{ vars.DATA_KEY }}
          SENTRY_DSN=${{ vars.SENTRY_DSN }}
          DISCORD_CLIENT_ID=${{ vars.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET=${{ vars.DISCORD_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN=${{ vars.DISCORD_BOT_TOKEN }}
          EOF
      - name: Deploy worker
        run: |
          [ -f .forkmesh-skip-deploy ] && exit 0
          cd app && ./deploy.sh changed
